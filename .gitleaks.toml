# Gitleaks configuration for dotns.
#
# Extends the upstream default ruleset and adds a project allowlist so the
# scanner ignores two well understood classes of false positive:
#   1. Vendored dependency trees we do not author (git submodules under lib/
#      and committed analysis snapshots under slither/).
#   2. The deterministic Anvil/Hardhat development accounts. Their private
#      keys are published in the tooling itself, are only ever used against a
#      local devnet, and must never appear on a real network.
#
# Anything outside those two cases is a genuine finding and fails the scan.

title = "dotns gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Vendored dependencies and public local-dev test keys"

# Vendored code we do not own. lib/ holds git submodules (OpenZeppelin);
# slither/ holds committed static-analysis snapshots that copy those submodules.
paths = [
  '''(^|/)lib/''',
  '''(^|/)slither/''',
]

# Deterministic Anvil/Hardhat accounts derived from the public mnemonic
# "test test test test test test test test test test test junk". These keys
# are documented in the tooling and carry no real funds.
regexes = [
  '''0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80''', # account 0
  '''0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d''', # account 1
  '''0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a''', # account 2
  '''0x7c852118294e51e653712a81e05800f419141751be58f605c371e15141b007a6''', # account 3
  '''0x47e179ec197488593b187f80a00eb0da91f1b9d0b13f8733639f19c30a34926a''', # account 4
  '''0x8b3a350cf5c34c9194ca85829a2df0ec3153be0318b5e2d3348e872092edffba''', # account 5
  '''0x92db14e403b83dfe3df233f83dfa3a0d7096f21ca9b0d6d6b8d88b2b4ec1564e''', # account 6
  '''0x4bbbf85ce3377467afe5d46f804f221813b2bb87f24d81f60f1fcdbf7cbf4356''', # account 7
