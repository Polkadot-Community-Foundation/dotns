name: Deploy Production (Polkadot Asset Hub)

# DotNS production deploy from the contract-deployer Cloud KMS key.
# mode=fork rehearses on a chopsticks fork of live Asset Hub with the
# *-rehearsal key; mode=live deploys to Polkadot Asset Hub; mode=devnet deploys
# a CI-only set to devnet Asset Hub with the *-devnet key (environment devnet).
# See "Production (Polkadot Asset Hub)" in DEPLOYMENTS.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fork (chopsticks fork of live Asset Hub, rehearsal key), live, or devnet (devnet Asset Hub, devnet key)"
        type: choice
        options: [fork, live, devnet]
        default: fork
      new_owner:
        description: "H160 of the dotns-owner pure proxy; receives ownership of the 14 owned contracts"
        required: true
        type: string
      sweep_to:
        description: "Optional mapped H160 for the leftover. Leave empty when AccountDataStore still deploys from this key after DotNS"
        required: false
        type: string
        default: ""
      confirm:
        description: 'Type "deploy dotns to polkadot" for mode=live'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write

# One deployer key, one nonce: never two runs at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.mode == 'devnet' && 'devnet' || 'production' }}
    timeout-minutes: 120
    # pipefail: a script piped into tee must still fail its step.
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_SIGNER: gcp
      NEW_OWNER: ${{ inputs.new_owner }}
      SWEEP_TO: ${{ inputs.sweep_to }}
      CONFIRM: ${{ inputs.confirm }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_KEY_RING: ${{ vars.GCP_KEY_RING }}
      # D5/D8: the key follows the mode; the scripts refuse any other key/chain pairing.
      GCP_KEY_NAME: ${{ inputs.mode == 'live' && 'contract-deployer' || inputs.mode == 'devnet' && 'contract-deployer-devnet' || 'contract-deployer-rehearsal' }}
      GCP_KEY_VERSION: ${{ vars.GCP_KEY_VERSION || '1' }}
      DOTNS_TLD: dot
      DOTNS_RELEASE_TAG: "0.8.0"
      # Fork and devnet runs never write the production manifest; devnet never the real devnet set.
      DEPLOYMENT_NETWORK: ${{ inputs.mode == 'live' && 'polkadot' || inputs.mode == 'devnet' && 'pcf-devnet-ci' || 'polkadot-rehearsal' }}
      EXPECTED_CHAIN_ID: ${{ inputs.mode == 'devnet' && '420420417' || '420420419' }}
      NATIVE_UNIT: ${{ inputs.mode == 'devnet' && 'PAS' || 'DOT' }}
      SUBSTRATE_WS_URL: ${{ vars.SUBSTRATE_WS_URL || (inputs.mode == 'devnet' && 'wss://asset-hub-paseo-rpc.n.dwellir.com' || 'wss://polkadot-asset-hub-rpc.polkadot.io') }}
      CHOPSTICKS_VERSION: "1.5.1"
      CHOPSTICKS_PORT: "8000"
      # devnet has a public ETH-RPC; fork and live run eth-rpc in the job.
      RPC_URL: ${{ inputs.mode == 'devnet' && (vars.ETH_RPC_URL || 'https://eth-rpc-testnet.polkadot.io') || 'http://127.0.0.1:8545' }}
      # Empty = build ./dockerfile (eth-rpc binary pinned by sha256).
      ETH_RPC_IMAGE: ${{ vars.ETH_RPC_IMAGE }}
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"

    steps:
      - name: Validate inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$NEW_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]] || fail "new_owner is not an H160"
          if [ -n "$SWEEP_TO" ]; then
            [[ "$SWEEP_TO" =~ ^0x[0-9a-fA-F]{40}$ ]] || fail "sweep_to is not an H160"
          fi
          if [ "$DEPLOY_MODE" = "live" ] && [ "$CONFIRM" != "deploy dotns to polkadot" ]; then
            fail 'mode=live requires confirm = "deploy dotns to polkadot"'
          fi
          env_name=production
          if [ "$DEPLOY_MODE" = "devnet" ]; then env_name=devnet; fi
          for v in GCP_PROJECT_ID GCP_LOCATION GCP_KEY_RING; do
            [ -n "${!v}" ] || fail "variable $v is not set on the $env_name environment"
          done
          if [ "$DEPLOY_MODE" = "fork" ]; then
            echo "SUBSTRATE_RPC_URL=ws://127.0.0.1:$CHOPSTICKS_PORT" >> "$GITHUB_ENV"
          else
            echo "SUBSTRATE_RPC_URL=$SUBSTRATE_WS_URL" >> "$GITHUB_ENV"
          fi

      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          chmod +x setup.bash
          bun install
          mkdir -p logs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Resolve the deployer address from the KMS key
        run: |
          DEPLOYER=$(cast wallet address --gcp)
          echo "DEPLOYER=$DEPLOYER" >> "$GITHUB_ENV"
          echo "Deployer $DEPLOYER ($GCP_KEY_NAME v$GCP_KEY_VERSION)"

      - name: Start a chopsticks fork of live Asset Hub
        if: inputs.mode == 'fork'
        run: |
          cat > chopsticks.yml <<EOF
          endpoint:
            - $SUBSTRATE_WS_URL
            - wss://asset-hub-polkadot-rpc.n.dwellir.com
          port: $CHOPSTICKS_PORT
          build-block-mode: Instant
          mock-signature-host: true
          runtime-log-level: 0
          EOF
          nohup npx --yes "@acala-network/chopsticks@$CHOPSTICKS_VERSION" -c chopsticks.yml \
            > logs/chopsticks.log 2>&1 &
          for _ in $(seq 1 120); do
            if cast rpc --rpc-url "http://127.0.0.1:$CHOPSTICKS_PORT" chain_getHeader >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          cast rpc --rpc-url "http://127.0.0.1:$CHOPSTICKS_PORT" chain_getHeader | jq -r '"fork head \(.number)"'
          # Production funding for DotNS: 40 DOT on the key's fallback account.
          python3 scripts/deploy/substrate.py fund "$DEPLOYER" 400000000000 \
            --rpc "http://127.0.0.1:$CHOPSTICKS_PORT"
          cast rpc --rpc-url "http://127.0.0.1:$CHOPSTICKS_PORT" dev_newBlock > /dev/null

      - name: Start eth-rpc
        if: inputs.mode != 'devnet'
        run: |
          image="$ETH_RPC_IMAGE"
          if [ -z "$image" ]; then
            image=revive-eth-rpc:ci
            docker build -t "$image" -f dockerfile .
          else
            docker pull "$image"
          fi
          docker run -d --name eth-rpc --network host "$image" \
            --node-rpc-url "$SUBSTRATE_RPC_URL" --rpc-port 8545 --eth-pruning 1
          for _ in $(seq 1 60); do
            if cast chain-id --rpc-url "$RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "eth-rpc chain id $(cast chain-id --rpc-url "$RPC_URL")"

      - name: Preflight
        run: |
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-before
          scripts/deploy/preflight.sh 2>&1 | tee logs/preflight.log

      - name: Deploy (factory + five stages)
        run: |
          scripts/deploy/deployall.sh > logs/deploy.log 2>&1 || { tail -80 logs/deploy.log; exit 1; }
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-deployed

      - name: Handover to dotns-owner
        run: |
          scripts/deploy/handover.sh 2>&1 | tee logs/handover.log
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-handed-over

      - name: Verify
        run: scripts/deploy/verify-production.sh 2>&1 | tee logs/verify.log

      - name: Sweep
        if: inputs.sweep_to != ''
        run: |
          scripts/deploy/sweep.sh 2>&1 | tee logs/sweep.log
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-after

      - name: Summary
        if: always()
        run: |
          dot() { python3 -c "import sys; print(f'{int(sys.argv[1]) / 1e10:.4f}')" "$1"; }
          read_balance() { if [ -s "logs/$1" ]; then cat "logs/$1"; fi; }
          before=$(read_balance balance-before)
          deployed=$(read_balance balance-deployed)
          handed=$(read_balance balance-handed-over)
          after=$(read_balance balance-after)
          manifest="deployments/$DEPLOYMENT_NETWORK/$EXPECTED_CHAIN_ID.json"
          {
            echo "### DotNS $DEPLOY_MODE deploy"
            echo ""
            echo "Deployer \`$DEPLOYER\` ($GCP_KEY_NAME), new owner \`$NEW_OWNER\`, chain $EXPECTED_CHAIN_ID, manifest \`$manifest\`."
            echo ""
            echo "| Step | $NATIVE_UNIT |"
            echo "|---|---:|"
            if [ -n "$before" ]; then echo "| Balance before | $(dot "$before") |"; fi
            if [ -n "$deployed" ]; then echo "| Deploy spend | $(dot "$((before - deployed))") |"; fi
            if [ -n "$handed" ]; then echo "| Handover spend | $(dot "$((deployed - handed))") |"; fi
            if [ -n "$after" ]; then echo "| Balance after sweep | $(dot "$after") |"; fi
            if [ -f "$manifest" ]; then
              echo ""
              echo "| Contract | Address |"
              echo "|---|---|"
              jq -r 'to_entries[] | select(.key | startswith("_") | not) | "| \(.key) | `\(.value)` |"' "$manifest"
            fi
          } | tee cost-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotns-${{ inputs.mode }}-deploy-${{ github.run_id }}
          path: |
            logs/
            cost-summary.md
            deployments/${{ env.DEPLOYMENT_NETWORK }}/
            broadcast/*/${{ env.EXPECTED_CHAIN_ID }}/
          retention-days: 90

      - name: Stop services
        if: always()
        run: |
          docker rm -f eth-rpc || true
          pkill -f "@acala-network/chopsticks" || true
