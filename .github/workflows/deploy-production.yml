name: Deploy Production (Polkadot Asset Hub)

# DotNS deploy from a Cloud KMS key. mode=devnet (default) deploys a CI-only
# set to devnet Asset Hub with the contract-deployer-devnet key (environment
# devnet); mode=live deploys to Polkadot Asset Hub with contract-deployer
# (environment production). No fork mode here: rehearse locally with
# scripts/deploy/rehearse-fork.sh. steps picks what one dispatch runs: all
# (preflight, deploy, handover, verify, sweep when sweep_to is set) or one of
# deploy, handover, verify, sweep; the standalone steps rebuild the set from
# the key and factory_nonce and check it on chain first. See "Production
# (Polkadot Asset Hub)" in DEPLOYMENTS.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "devnet (devnet Asset Hub, contract-deployer-devnet) or live (Polkadot Asset Hub, contract-deployer)"
        type: choice
        options: [devnet, live]
        default: devnet
      new_owner:
        description: "H160 of the dotns-owner pure proxy; receives ownership of the 14 owned contracts"
        required: true
        type: string
      steps:
        description: "all (preflight, deploy, handover, verify, sweep if sweep_to) or one step: deploy (preflight, deploy, verify as deployer-owned), handover (handover, verify), verify, sweep"
        type: choice
        options: [all, deploy, handover, verify, sweep]
        default: all
      factory_nonce:
        description: "Standalone steps only: the key nonce the factory was deployed at (the set is rebuilt from it). live accepts only 0"
        required: false
        type: string
        default: "0"
      sweep_to:
        description: "Mapped H160 for the leftover; required for steps=sweep, optional otherwise. Leave empty when AccountDataStore still deploys from this key after DotNS"
        required: false
        type: string
        default: ""
      confirm:
        description: 'Type "deploy dotns to polkadot" for mode=live'
        required: false
        type: string
        default: ""
      resume:
        description: "Resume a run that stopped part way: take the factory from the chain, adopt expected addresses that hold the expected code, deploy the rest (untested; rehearse on a fork first)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One deployer key, one nonce: never two runs at once.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.mode == 'live' && 'production' || 'devnet' }}
    timeout-minutes: 120
    # pipefail: a script piped into tee must still fail its step.
    defaults:
      run:
        shell: bash
    env:
      DEPLOY_MODE: ${{ inputs.mode }}
      DEPLOY_STEPS: ${{ inputs.steps }}
      FACTORY_NONCE_INPUT: ${{ inputs.factory_nonce }}
      DEPLOY_SIGNER: gcp
      NEW_OWNER: ${{ inputs.new_owner }}
      SWEEP_TO: ${{ inputs.sweep_to }}
      CONFIRM: ${{ inputs.confirm }}
      DEPLOY_RESUME: ${{ inputs.resume && '1' || '0' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_KEY_RING: ${{ vars.GCP_KEY_RING }}
      # The key follows the mode; the scripts refuse any other key/chain pairing.
      GCP_KEY_NAME: ${{ inputs.mode == 'live' && 'contract-deployer' || 'contract-deployer-devnet' }}
      GCP_KEY_VERSION: ${{ vars.GCP_KEY_VERSION || '1' }}
      DOTNS_TLD: dot
      DOTNS_RELEASE_TAG: "0.8.0"
      # devnet runs never write the real devnet set.
      DEPLOYMENT_NETWORK: ${{ inputs.mode == 'live' && 'polkadot' || 'pcf-devnet-ci' }}
      EXPECTED_CHAIN_ID: ${{ inputs.mode == 'live' && '420420419' || '420420417' }}
      NATIVE_UNIT: ${{ inputs.mode == 'live' && 'DOT' || 'PAS' }}
      SUBSTRATE_RPC_URL: ${{ vars.SUBSTRATE_WS_URL || (inputs.mode == 'live' && 'wss://polkadot-asset-hub-rpc.polkadot.io' || 'wss://asset-hub-paseo-rpc.n.dwellir.com') }}
      # devnet has a public ETH-RPC; live runs eth-rpc in the job.
      RPC_URL: ${{ inputs.mode == 'live' && 'http://127.0.0.1:8545' || (vars.ETH_RPC_URL || 'https://eth-rpc-testnet.polkadot.io') }}
      # Pinned eth-rpc adapter (pallet-revive-eth-rpc 0.21.0); the variable overrides it.
      ETH_RPC_IMAGE: ${{ vars.ETH_RPC_IMAGE || 'docker.io/parity/eth-rpc:v1.24.2@sha256:74ebf6671d93e6ab759de4f84454b4d00be011530845b8edaaa83dbfc64c40c9' }}
      FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"

    steps:
      - name: Validate inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }
          [[ "$NEW_OWNER" =~ ^0x[0-9a-fA-F]{40}$ ]] || fail "new_owner is not an H160"
          if [ -n "$SWEEP_TO" ]; then
            [[ "$SWEEP_TO" =~ ^0x[0-9a-fA-F]{40}$ ]] || fail "sweep_to is not an H160"
          fi
          if [ "$DEPLOY_MODE" = "live" ] && [ "$CONFIRM" != "deploy dotns to polkadot" ]; then
            fail 'mode=live requires confirm = "deploy dotns to polkadot"'
          fi
          # Live deploys run from a release tag, so the deployed commit has a permanent name.
          if [ "$DEPLOY_MODE" = "live" ] && [ "$GITHUB_REF_TYPE" != "tag" ]; then
            fail "mode=live must be dispatched from a release tag, not $GITHUB_REF_TYPE $GITHUB_REF_NAME"
          fi
          echo "ref: $GITHUB_REF_TYPE $GITHUB_REF_NAME ($GITHUB_SHA)"
          [[ "$FACTORY_NONCE_INPUT" =~ ^[0-9]+$ ]] || fail "factory_nonce is not a non-negative integer"
          if [ "$DEPLOY_MODE" = "live" ] && [ "$FACTORY_NONCE_INPUT" != "0" ]; then
            fail "mode=live: the factory is the key's nonce-0 transaction, factory_nonce must be 0"
          fi
          if [ "$DEPLOY_STEPS" = "sweep" ] && [ -z "$SWEEP_TO" ]; then
            fail "steps=sweep requires sweep_to"
          fi
          if [ "$DEPLOY_RESUME" = "1" ] && [ "$DEPLOY_STEPS" != "all" ] && [ "$DEPLOY_STEPS" != "deploy" ]; then
            fail "resume applies to steps=all or deploy only"
          fi
          env_name=devnet
          if [ "$DEPLOY_MODE" = "live" ]; then env_name=production; fi
          for v in GCP_PROJECT_ID GCP_LOCATION GCP_KEY_RING; do
            [ -n "${!v}" ] || fail "variable $v is not set on the $env_name environment"
          done

      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      - name: Install Foundry
        uses: ./.github/actions/setup-foundry

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          chmod +x setup.bash
          bun install
          mkdir -p logs

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Resolve the deployer address from the KMS key
        run: |
          DEPLOYER=$(cast wallet address --gcp)
          echo "DEPLOYER=$DEPLOYER" >> "$GITHUB_ENV"
          echo "Deployer $DEPLOYER ($GCP_KEY_NAME v$GCP_KEY_VERSION)"

      - name: Start eth-rpc
        if: inputs.mode == 'live'
        run: |
          docker pull "$ETH_RPC_IMAGE"
          docker run -d --name eth-rpc --network host "$ETH_RPC_IMAGE" \
            --node-rpc-url "$SUBSTRATE_RPC_URL" --rpc-port 8545 --eth-pruning 1
          for _ in $(seq 1 60); do
            if cast chain-id --rpc-url "$RPC_URL" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "eth-rpc chain id $(cast chain-id --rpc-url "$RPC_URL")"

      # Each step records its wall-clock time (logs/elapsed-<step>, bash SECONDS) for
      # the summary, and the balance it ends with.
      - name: Preflight
        if: inputs.steps == 'all' || inputs.steps == 'deploy'
        run: |
          trap 'echo $SECONDS > logs/elapsed-preflight' EXIT
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-before
          scripts/deploy/preflight.sh 2>&1 | tee logs/preflight.log
          # devnet may deploy from a used key: the factory sits at the key's current nonce.
          grep '^FACTORY_NONCE=' logs/preflight.log | tail -1 >> "$GITHUB_ENV"

      # A standalone step has no manifest from the deploy run: rebuild the set from
      # the key and factory_nonce, check the code on chain, write the manifest.
      - name: Rebuild the manifest from the chain
        if: inputs.steps == 'handover' || inputs.steps == 'verify' || inputs.steps == 'sweep'
        env:
          FACTORY_NONCE: ${{ inputs.factory_nonce }}
        run: |
          trap 'echo $SECONDS > logs/elapsed-rebuild' EXIT
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-before
          scripts/deploy/rebuild-manifest.sh 2>&1 | tee logs/rebuild-manifest.log
          echo "FACTORY_NONCE=$FACTORY_NONCE" >> "$GITHUB_ENV"

      # The full forge output goes to logs/deploy.log; the job log gets the stage
      # headers, estimates, errors and, from a watcher, every landed transaction
      # plus a heartbeat (nonce, balance) every 30 s.
      - name: Deploy (factory + five stages)
        if: inputs.steps == 'all' || inputs.steps == 'deploy'
        run: |
          trap 'echo $SECONDS > logs/elapsed-deploy; kill "$watcher" 2>/dev/null; wait "$watcher" 2>/dev/null || true' EXIT
          python3 scripts/deploy/progress.py watch --deployer "$DEPLOYER" --substrate-rpc "$SUBSTRATE_RPC_URL" \
            --eth-rpc "$RPC_URL" --chain-id "$EXPECTED_CHAIN_ID" --unit "$NATIVE_UNIT" --since "$(date +%s)" &
          watcher=$!
          scripts/deploy/deployall.sh 2>&1 | tee logs/deploy.log | python3 scripts/deploy/progress.py filter \
            || { tail -80 logs/deploy.log | cut -c1-400; exit 1; }
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-deployed

      - name: Handover to dotns-owner
        if: inputs.steps == 'all' || inputs.steps == 'handover'
        run: |
          trap 'echo $SECONDS > logs/elapsed-handover; kill "$watcher" 2>/dev/null; wait "$watcher" 2>/dev/null || true' EXIT
          python3 scripts/deploy/progress.py watch --deployer "$DEPLOYER" --substrate-rpc "$SUBSTRATE_RPC_URL" \
            --eth-rpc "$RPC_URL" --chain-id "$EXPECTED_CHAIN_ID" --unit "$NATIVE_UNIT" --since "$(date +%s)" &
          watcher=$!
          scripts/deploy/handover.sh 2>&1 | tee logs/handover.log
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-handed-over

      # steps=deploy verifies the set as the deployer still owns it.
      - name: Verify
        if: inputs.steps != 'sweep'
        run: |
          trap 'echo $SECONDS > logs/elapsed-verify' EXIT
          if [ "$DEPLOY_STEPS" = "deploy" ]; then export EXPECTED_OWNER="$DEPLOYER"; fi
          scripts/deploy/verify-production.sh 2>&1 | tee logs/verify.log

      - name: Sweep
        if: (inputs.steps == 'all' && inputs.sweep_to != '') || inputs.steps == 'sweep'
        run: |
          trap 'echo $SECONDS > logs/elapsed-sweep' EXIT
          scripts/deploy/sweep.sh 2>&1 | tee logs/sweep.log
          python3 scripts/deploy/substrate.py account "$DEPLOYER" --rpc "$SUBSTRATE_RPC_URL" \
            | jq -r .free > logs/balance-after

      - name: Summary
        if: always()
        run: |
          dot() { python3 -c "import sys; print(f'{int(sys.argv[1]) / 1e10:.4f}')" "$1"; }
          read_balance() { if [ -s "logs/$1" ]; then cat "logs/$1"; fi; }
          before=$(read_balance balance-before)
          deployed=$(read_balance balance-deployed)
          handed=$(read_balance balance-handed-over)
          after=$(read_balance balance-after)
          manifest="deployments/$DEPLOYMENT_NETWORK/$EXPECTED_CHAIN_ID.json"
          {
            echo "### DotNS $DEPLOY_MODE deploy (steps: $DEPLOY_STEPS)"
            echo ""
            echo "Deployer \`$DEPLOYER\` ($GCP_KEY_NAME, factory nonce ${FACTORY_NONCE:-?}$([ "$DEPLOY_RESUME" = "1" ] && echo ", resumed")), new owner \`$NEW_OWNER\`, chain $EXPECTED_CHAIN_ID, manifest \`$manifest\`."
            echo ""
            echo "| Step | $NATIVE_UNIT |"
            echo "|---|---:|"
            if [ -n "$before" ]; then echo "| Balance before | $(dot "$before") |"; fi
            if [ -n "$deployed" ]; then echo "| Deploy spend | $(dot "$((before - deployed))") |"; fi
            # Standalone handover: the spend counts from the balance before the step.
            if [ -n "$handed" ]; then echo "| Handover spend | $(dot "$((${deployed:-$before} - handed))") |"; fi
            if [ -n "$after" ]; then echo "| Balance after sweep | $(dot "$after") |"; fi
            echo ""
            echo "| Step | Time |"
            echo "|---|---:|"
            for step in preflight rebuild deploy handover verify sweep; do
              if [ -s "logs/elapsed-$step" ]; then
                s=$(cat "logs/elapsed-$step")
                echo "| $step | $((s / 60))m $((s % 60))s |"
              fi
            done
            if [ -f "$manifest" ]; then
              echo ""
              echo "| Contract | Address |"
              echo "|---|---|"
              jq -r 'to_entries[] | select(.key | startswith("_") | not) | "| \(.key) | `\(.value)` |"' "$manifest"
            fi
          } | tee cost-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotns-${{ inputs.mode }}-deploy-${{ github.run_id }}
          path: |
            logs/
            cost-summary.md
            deployments/${{ env.DEPLOYMENT_NETWORK }}/
            broadcast/*/${{ env.EXPECTED_CHAIN_ID }}/
          retention-days: 90

      - name: Stop services
        if: always()
        run: docker rm -f eth-rpc || true
