name: Run Solidity Tests

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "script/**", "test/**", "**.sol"]
  push:
    branches: [main]
    paths: ["src/**", "script/**", "test/**", "**.sol"]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?

          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          forge test -vv --summary 2>&1 | tee test.log
          TEST=${PIPESTATUS[0]}

          python3 << 'EOF'
          import os
          import re
          from collections import OrderedDict

          def out(k, v):
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write(f"{k}={v}\n")

          with open("test.log", "r", encoding="utf-8", errors="ignore") as f:
              content = f.read()

          suite_header_re = re.compile(r"^Running\s+\d+\s+tests?\s+for\s+(test/[^:]+):([A-Za-z0-9_]+)\s*$")
          suite_result_re = re.compile(r"^Suite result:\s*(.*)\s*$")
          test_line_re = re.compile(r"^\[(PASS|FAIL[^\]]*)\]\s+([A-Za-z0-9_]+)\(\)(?:\s*\(([^)]*)\))?.*$")

          suites = OrderedDict()
          current_suite = None

          for line in content.splitlines():
              m = suite_header_re.match(line.strip())
              if m:
                  file_path, contract = m.group(1), m.group(2)
                  current_suite = f"{file_path}:{contract}"
                  if current_suite not in suites:
                      suites[current_suite] = {
                          "file": file_path,
                          "contract": contract,
                          "tests": [],
                          "suite_result": None,
                      }
                  continue

              m = test_line_re.match(line.strip())
              if m and current_suite:
                  tag = m.group(1)
                  test_name = m.group(2)
                  outcome = "PASS" if tag == "PASS" else "FAIL"
                  error = ""
                  if outcome == "FAIL":
                      err = tag
                      if err.startswith("FAIL"):
                          err = err[4:].lstrip(": .").strip()
                      error = err
                  suites[current_suite]["tests"].append({
                      "name": test_name,
                      "outcome": outcome,
                      "error": error,
                  })
                  continue

              m = suite_result_re.match(line.strip())
              if m and current_suite:
                  suites[current_suite]["suite_result"] = f"Suite result: {m.group(1).strip()}"
                  continue

          total_passed = 0
          total_failed = 0
          total_skipped = 0

          md = []
          md.append("## Contract test results\n")

          for suite_key, s in suites.items():
              md.append(f"### {s['contract']} ({s['file']})\n")
              md.append("| Test name | Outcome | Error |")
              md.append("|:--|:--:|:--|")

              for t in s["tests"]:
                  name = t["name"]
                  outcome = t["outcome"]
                  error = t["error"].replace("|", "\\|")
                  md.append(f"| {name} | {outcome} | {error} |")

                  if outcome == "PASS":
                      total_passed += 1
                  else:
                      total_failed += 1

              md.append("")
              if s["suite_result"]:
                  md.append(s["suite_result"])
              md.append("")

          total = total_passed + total_failed + total_skipped

          if total_failed > 0:
              out("result", f"Failed - {total_failed} of {total} tests failed")
              out("has_details", "true")
          elif total > 0:
              out("result", f"All tests passed ({total} total)")
              out("has_details", "true")
          else:
              out("result", "No tests found")
              out("has_details", "false")

          with open("test-details.md", "w", encoding="utf-8") as f:
              f.write("\n".join(md))
          EOF

          if [ $TEST -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            *.log
            test-details.md
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('test-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};

            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';

              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }

              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;

            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
