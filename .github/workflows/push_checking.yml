name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']
  push:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?
          
          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          forge test -vv 2>&1 | tee test.log
          TEST=${PIPESTATUS[0]}

          PASSED=$(grep -oE '[0-9]+ passed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")

          # Generate details markdown
          python3 << 'EOF'
          import re
          import os

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          with open('test.log', 'r') as f:
              content = f.read()

          # Parse test results
          passed_tests = []
          failed_tests = []

          # Match test results like [PASS] testSomething() (gas: 12345)
          for match in re.finditer(r'\[(PASS|FAIL)\]\s+(\S+)\s*(?:\(([^)]+)\))?', content):
              status, name, info = match.groups()
              if status == 'PASS':
                  passed_tests.append({'name': name, 'info': info or ''})
              else:
                  failed_tests.append({'name': name, 'info': info or ''})

          total = len(passed_tests) + len(failed_tests)
          
          if len(failed_tests) > 0:
              out('result', f'Failed - {len(failed_tests)} of {total} tests failed')
              out('has_details', 'true')
          elif total > 0:
              out('result', 'All tests passed')
              out('has_details', 'true')
          else:
              out('result', 'No tests found')
              out('has_details', 'false')

          # Build details markdown
          md = []
          
          if failed_tests:
              md.append(f"\n**Failed ({len(failed_tests)})**\n")
              md.append("| Test | Info |")
              md.append("|:-----|:-----|")
              for t in failed_tests[:20]:
                  md.append(f"| {t['name']} | {t['info'][:50]} |")
              if len(failed_tests) > 20:
                  md.append(f"| +{len(failed_tests)-20} more | |")

          if passed_tests:
              md.append(f"\n**Passed ({len(passed_tests)})**\n")
              md.append("| Test | Gas |")
              md.append("|:-----|----:|")
              for t in passed_tests[:20]:
                  gas = ''
                  if 'gas:' in t['info']:
                      gas = t['info'].replace('gas:', '').strip()
                  md.append(f"| {t['name']} | {gas} |")
              if len(passed_tests) > 20:
                  md.append(f"| +{len(passed_tests)-20} more | |")

          with open('test-details.md', 'w') as f:
              f.write('\n'.join(md))
          EOF

          if [ $TEST -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            *.log
            test-details.md
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('test-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
              
              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            // Update details
            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            // Build details section
            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;
            
            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }