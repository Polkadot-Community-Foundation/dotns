name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']
  push:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?
          forge test -vv > test.log 2>&1
          TEST=$?

          PASSED=$(grep -oE '[0-9]+ passed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          TOTAL=$((PASSED + FAILED))

          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            exit 1
          elif [ $TEST -eq 0 ]; then
            echo "result=Passed - ${PASSED}/${TOTAL} tests passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=Failed - ${FAILED}/${TOTAL} tests failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: '*.log'
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          RESULT: ${{ steps.run.outputs.result }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              if (parts[1]) detailsSection = `\n${detailsMarker}${parts[1]}`;
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
            }

            rows[section] = result;

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }