name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']
  push:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?
          forge test -vv > test.log 2>&1
          TEST=$?

          PASSED=$(grep -oE '[0-9]+ passed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")

          if [ $BUILD -eq 0 ] && [ $TEST -eq 0 ]; then
            echo "status=Passed" >> "$GITHUB_OUTPUT"
            echo "summary=${PASSED} tests passed" >> "$GITHUB_OUTPUT"
          else
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            [ $BUILD -ne 0 ] && echo "summary=Build failed" >> "$GITHUB_OUTPUT" && exit 1
            echo "summary=${FAILED} tests failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: '*.log'
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          STATUS: ${{ steps.run.outputs.status }}
          SUMMARY: ${{ steps.run.outputs.summary }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const tableEnd = "<!-- table-end -->";
            const section = process.env.SECTION;
            const status = process.env.STATUS || 'Unknown';
            const summary = process.env.SUMMARY || '';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            if (existing?.body) {
              const tableSection = existing.body.split(tableEnd)[0] || existing.body;
              const rowRegex = /^\| ([^|]+) \| ([^|]+) \| ([^|]+) \|$/gm;
              let match;
              while ((match = rowRegex.exec(tableSection)) !== null) {
                const name = match[1].trim();
                if (name && name !== 'Check' && !name.startsWith(':')) {
                  rows[name] = { status: match[2].trim(), summary: match[3].trim() };
                }
              }
              const detailsMatch = existing.body.match(/<!-- table-end -->([\s\S]*$)/);
              if (detailsMatch) detailsSection = detailsMatch[1];
            }

            rows[section] = { status, summary };

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key].status} | ${rows[key].summary} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${tableEnd}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }