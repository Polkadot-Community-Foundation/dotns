name: Run Solidity Tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']
  push:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?
          
          if [ $BUILD -ne 0 ]; then
            echo "result=Failed - Build error" >> "$GITHUB_OUTPUT"
            echo "has_details=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          
          # Run tests with summary for better parsing
          forge test -vv --summary 2>&1 | tee test.log
          TEST=${PIPESTATUS[0]}

          # Process results
          python3 << 'EOF'
          import re
          import os
          from collections import defaultdict

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          with open('test.log', 'r') as f:
              content = f.read()

          # Parse ALL tests for accurate counts
          all_contracts = defaultdict(lambda: {'passed': [], 'failed': []})
          # Parse ONLY invariant tests for detailed display
          invariant_tests = []
          
          current_contract = None
          current_invariant = None
          collecting_table = False
          table_lines = []

          lines = content.split('\n')
          for i, line in enumerate(lines):
              # Match contract header
              contract_match = re.search(r'for test/([^:]+):(\w+)', line)
              if contract_match:
                  current_contract = contract_match.group(2)
              
              # Match test results
              pass_match = re.match(r'\[PASS\]\s+(\w+)\(\)\s*(\([^)]+\))?', line)
              fail_match = re.match(r'\[FAIL[:\.]?\s*[^\]]*\]\s+(\w+)\(\)', line)
              
              if pass_match and current_contract:
                  test_name = pass_match.group(1)
                  test_details = pass_match.group(2) or ''
                  is_invariant = test_name.startswith('invariant_')
                  
                  # Add to all_contracts for total count
                  all_contracts[current_contract]['passed'].append({
                      'name': test_name,
                      'details': test_details,
                      'is_invariant': is_invariant
                  })
                  
                  # For invariant tests, start collecting detailed info
                  if is_invariant:
                      current_invariant = {
                          'contract': current_contract,
                          'name': test_name,
                          'details': test_details,
                          'table': []
                      }
                      collecting_table = True
                      
              elif fail_match and current_contract:
                  test_name = fail_match.group(1)
                  is_invariant = test_name.startswith('invariant_')
                  
                  all_contracts[current_contract]['failed'].append({
                      'name': test_name,
                      'is_invariant': is_invariant
                  })
                  
                  if is_invariant:
                      current_invariant = {
                          'contract': current_contract,
                          'name': test_name,
                          'details': '',
                          'failed': True,
                          'table': []
                      }
                      collecting_table = True
              
              # Collect table lines for invariant tests
              if collecting_table and current_invariant:
                  # Check if we're in the statistics table
                  if '╭' in line or '├' in line or '│' in line or '╰' in line or '═' in line:
                      table_lines.append(line)
                  elif line.strip().startswith('|') and ('Contract' in line or 'Selector' in line or 'Calls' in line):
                      table_lines.append(line)
                  elif line.strip() == '' and table_lines:
                      # End of table
                      current_invariant['table'] = table_lines
                      invariant_tests.append(current_invariant)
                      current_invariant = None
                      collecting_table = False
                      table_lines = []

          # Calculate totals from ALL tests
          total_passed = sum(len(c['passed']) for c in all_contracts.values())
          total_failed = sum(len(c['failed']) for c in all_contracts.values())
          total = total_passed + total_failed
          
          # Calculate invariant test counts
          invariant_passed = sum(1 for t in invariant_tests if not t.get('failed'))
          invariant_failed = sum(1 for t in invariant_tests if t.get('failed'))
          invariant_total = len(invariant_tests)

          if total_failed > 0:
              out('result', f'Failed - {total_failed} of {total} tests failed')
              out('has_details', 'true')
          elif total > 0:
              out('result', f'All tests passed ({total} total)')
              out('has_details', 'true')
          else:
              out('result', 'No tests found')
              out('has_details', 'false')

          # Build markdown showing invariant tests with details
          md = []
          md.append(f"### Invariant Tests: {invariant_passed} passed, {invariant_failed} failed (of {invariant_total} total)")
          md.append(f"### All Tests: {total_passed} passed, {total_failed} failed (of {total} total)\n")
          
          # Group by contract
          contracts_dict = defaultdict(list)
          for test in invariant_tests:
              contracts_dict[test['contract']].append(test)
          
          # Failed tests first
          for contract, tests in sorted(contracts_dict.items()):
              failed_tests = [t for t in tests if t.get('failed')]
              if failed_tests:
                  md.append(f"\n## {contract} - Failed\n")
                  for test in failed_tests:
                      md.append(f"### {test['name']}()\n")
                      if test.get('table'):
                          md.append("```")
                          md.extend(test['table'])
                          md.append("```\n")
          
          # Passed tests
          for contract, tests in sorted(contracts_dict.items()):
              passed_tests = [t for t in tests if not t.get('failed')]
              if passed_tests:
                  md.append(f"\n## {contract}\n")
                  for test in passed_tests[:10]:  # Limit to 10 per contract
                      # Extract stats from details
                      details = test.get('details', '')
                      md.append(f"### {test['name']}() {details}\n")
                      
                      if test.get('table'):
                          md.append("```")
                          md.extend(test['table'])
                          md.append("```\n")
                  
                  if len(passed_tests) > 10:
                      md.append(f"\n*+{len(passed_tests)-10} more tests*\n")

          with open('test-details.md', 'w') as f:
              f.write('\n'.join(md))
          EOF

          if [ $TEST -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            *.log
            test-details.md
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          RESULT: ${{ steps.run.outputs.result }}
          HAS_DETAILS: ${{ steps.run.outputs.has_details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const detailsMarker = "<!-- details-section -->";
            const section = process.env.SECTION;
            const result = process.env.RESULT || 'Unknown';
            const hasDetails = process.env.HAS_DETAILS === 'true';
            const runId = process.env.RUN_ID;
            const repoFull = process.env.REPO;

            let details = '';
            try { details = fs.readFileSync('test-details.md', 'utf8').trim(); } catch {}

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let existingDetails = {};
            
            if (existing?.body) {
              const parts = existing.body.split(detailsMarker);
              const tableSection = parts[0] || '';
              
              const lines = tableSection.split('\n');
              for (const line of lines) {
                const match = line.match(/^\| ([^|]+) \| ([^|]+) \|$/);
                if (match) {
                  const name = match[1].trim();
                  if (name && name !== 'Check' && !name.startsWith(':')) {
                    rows[name] = match[2].trim();
                  }
                }
              }
              
              const detailsRegex = /<details>\s*<summary><strong>([^<]+)<\/strong><\/summary>([\s\S]*?)<\/details>/g;
              let detailMatch;
              while ((detailMatch = detailsRegex.exec(existing.body)) !== null) {
                existingDetails[detailMatch[1].trim()] = detailMatch[0];
              }
            }

            rows[section] = result;

            if (hasDetails && details) {
              existingDetails[section] = `<details>\n<summary><strong>${section}</strong></summary>\n\n${details}\n\n[View full logs](https://github.com/${repoFull}/actions/runs/${runId})\n\n</details>`;
            } else {
              delete existingDetails[section];
            }

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Result |\n|:------|:-------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key]} |\n`;
            }

            const detailsOrder = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Coverage'];
            const sortedDetails = Object.keys(existingDetails).sort((a, b) => {
              const ai = detailsOrder.indexOf(a), bi = detailsOrder.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let body = `${marker}\n## CI Summary\n\n${table}`;
            
            if (sortedDetails.length > 0) {
              body += `\n${detailsMarker}\n\n---\n\n${sortedDetails.map(k => existingDetails[k]).join('\n\n')}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }