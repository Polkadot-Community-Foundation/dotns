name: Test Solidity Contracts

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "script/**"
      - "test/**"
      - "**.sol"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "script/**"
      - "test/**"
      - "**.sol"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run contract tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      - name: Install project dependencies
        run: bun install

      - name: Build + test
        id: run
        shell: bash
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e

          forge build --sizes > forge-build.log 2>&1
          BUILD_CODE=$?

          forge test -vv > forge-test.log 2>&1
          TEST_CODE=$?

          forge test --gas-report > forge-gas.log 2>&1
          GAS_CODE=$?

          TESTS_PASSED=$(grep -oE '[0-9]+ passed' forge-test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          TESTS_FAILED=$(grep -oE '[0-9]+ failed' forge-test.log | head -1 | grep -oE '[0-9]+' || echo "0")

          if [ $BUILD_CODE -eq 0 ] && [ $TEST_CODE -eq 0 ] && [ $GAS_CODE -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "test_count=${TESTS_PASSED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "test_count=${TESTS_FAILED}" >> "$GITHUB_OUTPUT"

          if [ $BUILD_CODE -ne 0 ]; then
            echo "failure_type=build" >> "$GITHUB_OUTPUT"
          elif [ $TEST_CODE -ne 0 ]; then
            echo "failure_type=test" >> "$GITHUB_OUTPUT"
          else
            echo "failure_type=gas" >> "$GITHUB_OUTPUT"
          fi

          # Write error details to file
          {
            if [ $BUILD_CODE -ne 0 ]; then
              echo "Build Errors:"
              grep -iE "error|Error" forge-build.log | head -20 || tail -n 20 forge-build.log
            fi
            if [ $TEST_CODE -ne 0 ]; then
              echo "Failed Tests:"
              grep -E "FAIL|Failing|failed" forge-test.log | head -15
              echo ""
              grep -A 2 -E "Error:|error:" forge-test.log | head -20
            fi
            if [ $GAS_CODE -ne 0 ]; then
              echo "Gas Report Errors:"
              tail -n 15 forge-gas.log
            fi
          } > test-error-details.txt 2>/dev/null

          exit 1

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            forge-*.log
            test-error-details.txt
          retention-days: 7

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          SUCCESS: ${{ steps.run.outputs.success }}
          TEST_COUNT: ${{ steps.run.outputs.test_count }}
          FAILURE_TYPE: ${{ steps.run.outputs.failure_type }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const testCount = process.env.TEST_COUNT || '0';
            const failureType = process.env.FAILURE_TYPE || '';
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            const status = success ? "✅" : "❌";
            let summary;
            if (success) {
              summary = `${testCount} tests passed`;
            } else if (failureType === 'build') {
              summary = "Build failed";
            } else if (failureType === 'test') {
              summary = `${testCount} tests failed`;
            } else {
              summary = "Gas report failed";
            }
            
            // Read error details
            let details = "";
            try {
              if (fs.existsSync('test-error-details.txt')) {
                details = fs.readFileSync('test-error-details.txt', 'utf8').trim().substring(0, 2000);
              }
            } catch (e) {}
            
            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| ${section} | ${status} | ${summary} |\n`;
            
            if (!success && details) {
              block += `\n<details>\n<summary>📋 ${section} Details</summary>\n\n`;
              block += `\`\`\`\n${details}\n\`\`\`\n\n`;
              block += `[View full logs](https://github.com/${repo}/actions/runs/${runId})\n`;
              block += `</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const tableHeader = "| Check | Status | Summary |\n|:------|:------:|:--------|\n";
            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}`;
            
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              const headerEnd = baseBody.indexOf('\n', baseBody.indexOf('|:---'));
              if (headerEnd !== -1) {
                nextBody = baseBody.slice(0, headerEnd + 1) + block + baseBody.slice(headerEnd + 1);
              } else {
                nextBody = baseBody + block;
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }