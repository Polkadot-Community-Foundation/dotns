name: Contract Tests

on:
  pull_request:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']
  push:
    branches: [main]
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - run: bun install

      - name: Run tests
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          forge build --sizes > build.log 2>&1
          BUILD=$?
          forge test -vv > test.log 2>&1
          TEST=$?
          
          PASSED=$(grep -oE '[0-9]+ passed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          FAILED=$(grep -oE '[0-9]+ failed' test.log | head -1 | grep -oE '[0-9]+' || echo "0")
          
          if [ $BUILD -eq 0 ] && [ $TEST -eq 0 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "summary=${PASSED} tests passed" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            [ $BUILD -ne 0 ] && echo "summary=Build failed" >> "$GITHUB_OUTPUT" && exit 1
            echo "summary=${FAILED} tests failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: '*.log'
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Contract Tests
          SUCCESS: ${{ steps.run.outputs.success }}
          SUMMARY: ${{ steps.run.outputs.summary }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const status = success ? "✅" : "❌";
            const summary = process.env.SUMMARY || (success ? "Passed" : "Failed");
            
            const sectionStart = `<!-- ${section}:start -->`;
            const sectionEnd = `<!-- ${section}:end -->`;
            const row = `| ${section} | ${status} | ${summary} |\n`;
            const block = `${sectionStart}\n${row}${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            const header = `${marker}\n## CI Summary\n\n| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            let body = existing?.body ?? header;
            
            if (body.includes(sectionStart)) {
              const re = new RegExp(`${sectionStart}\\n[\\s\\S]*?${sectionEnd}\\n`, "m");
              body = body.replace(re, block);
            } else {
              const insertPoint = body.indexOf('\n|:---');
              const insertAfter = body.indexOf('\n', insertPoint + 1);
              body = body.slice(0, insertAfter + 1) + block + body.slice(insertAfter + 1);
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }