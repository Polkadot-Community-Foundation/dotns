name: 4naly3er Static Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "src/**"
      - "contracts/**"
      - "foundry.toml"
      - "remappings.txt"
      - ".github/workflows/4naly3er.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge install

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge build --build-info

      - name: Checkout 4naly3er
        uses: actions/checkout@v4
        with:
          repository: Picodes/4naly3er
          path: .4naly3er

      - name: Remove problematic detector
        run: rm -f .4naly3er/src/issues/NC/uselessOverride.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"
          cache-dependency-path: .4naly3er/yarn.lock

      - name: Install 4naly3er dependencies
        working-directory: .4naly3er
        run: yarn install

      - name: Run 4naly3er
        continue-on-error: true
        run: |
          cd .4naly3er
          if [ -d "../src" ]; then
            yarn analyze "../src" "" "${{ github.server_url }}/${{ github.repository }}" || true
          elif [ -d "../contracts" ]; then
            yarn analyze "../contracts" "" "${{ github.server_url }}/${{ github.repository }}" || true
          fi
          cd ..

      - name: Process output
        id: run
        if: always()
        shell: bash
        run: |
          python3 << 'PYTHON_EOF'
          import os
          import re
          from collections import defaultdict

          def write_output(name, value):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write(f"{name}={value}\n")

          def escape_md(s):
              return s.replace('|', '\\|').replace('\n', ' ').strip()

          report_path = '.4naly3er/report.md'

          if not os.path.exists(report_path):
              write_output('success', 'false')
              write_output('summary', 'No report generated')
              write_output('total', '0')
              exit(0)

          with open(report_path, 'r', encoding='utf-8') as f:
              content = f.read()

          if not content.strip():
              write_output('success', 'false')
              write_output('summary', 'Empty report')
              write_output('total', '0')
              exit(0)

          # Parse findings by category
          # 4naly3er format: ### [H-01] Title\nDescription...\n*Instances (N)*
          findings = defaultdict(list)
          
          # Match patterns like ### [H-01], ### [M-01], ### [L-01], ### [G-01], ### [NC-01]
          pattern = r'###\s*\[([A-Z]+)-(\d+)\]\s*([^\n]+)\n([\s\S]*?)(?=###\s*\[|## |\Z)'
          
          for match in re.finditer(pattern, content):
              cat = match.group(1)
              num = match.group(2)
              title = escape_md(match.group(3).strip())
              body = match.group(4).strip()
              
              # Extract instance count
              instance_match = re.search(r'\*Instances\s*\((\d+)\)\*', body)
              instances = instance_match.group(1) if instance_match else '?'
              
              # Extract first file location
              loc_match = re.search(r'(src/[^\s:]+:\d+|contracts/[^\s:]+:\d+)', body)
              location = f"`{loc_match.group(1)}`" if loc_match else ''
              
              findings[cat].append({
                  'id': f'{cat}-{num}',
                  'title': title[:80] + ('...' if len(title) > 80 else ''),
                  'instances': instances,
                  'location': location
              })

          # Map categories
          cat_names = {
              'H': 'High',
              'M': 'Medium', 
              'L': 'Low',
              'G': 'Gas',
              'NC': 'Non-Critical'
          }
          
          cat_icons = {
              'H': '🔴',
              'M': '🟠',
              'L': '🟡',
              'G': '⛽',
              'NC': '🔵'
          }

          total = sum(len(v) for v in findings.values())
          high = len(findings.get('H', []))
          medium = len(findings.get('M', []))
          low = len(findings.get('L', []))
          gas = len(findings.get('G', []))
          nc = len(findings.get('NC', []))

          if total == 0:
              write_output('success', 'true')
              write_output('summary', 'No issues found')
              write_output('total', '0')
          else:
              parts = []
              if high > 0: parts.append(f'H:{high}')
              if medium > 0: parts.append(f'M:{medium}')
              if low > 0: parts.append(f'L:{low}')
              if gas > 0: parts.append(f'G:{gas}')
              if nc > 0: parts.append(f'NC:{nc}')
              
              write_output('success', 'false' if high > 0 else 'true')
              write_output('summary', f"{total} findings ({' '.join(parts)}) · See details below ↓")
              write_output('total', str(total))

          # Generate detailed markdown
          md_lines = []
          
          for cat in ['H', 'M', 'L', 'G', 'NC']:
              items = findings.get(cat, [])
              if not items:
                  continue
              
              icon = cat_icons.get(cat, '⚪')
              name = cat_names.get(cat, cat)
              
              md_lines.append(f'<details>')
              md_lines.append(f'<summary>{icon} <strong>{name}</strong> ({len(items)})</summary>')
              md_lines.append('')
              md_lines.append('| ID | Finding | Instances |')
              md_lines.append('|:---|:--------|:---------:|')
              
              for item in items[:20]:
                  md_lines.append(f"| `{item['id']}` | {item['title']} | {item['instances']} |")
              
              if len(items) > 20:
                  md_lines.append(f'| | *...and {len(items) - 20} more* | |')
              
              md_lines.append('')
              md_lines.append('</details>')
              md_lines.append('')

          with open('4naly3er-findings.md', 'w') as f:
              f.write('\n'.join(md_lines))
          PYTHON_EOF

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: 4naly3er Analysis
          SUCCESS: ${{ steps.run.outputs.success }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          TOTAL: ${{ steps.run.outputs.total }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const summary = process.env.SUMMARY || '';
            const total = parseInt(process.env.TOTAL || '0');
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            // Determine status icon
            let status = "✅";
            if (summary.includes('H:')) status = "❌";
            else if (summary.includes('M:') || summary.includes('L:')) status = "⚠️";
            else if (total === 0) status = "✅";
            
            // Read detailed findings
            let findings = "";
            try {
              if (fs.existsSync('4naly3er-findings.md')) {
                findings = fs.readFileSync('4naly3er-findings.md', 'utf8').trim();
              }
            } catch (e) {}
            
            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;
            const detailsStart = `<!-- details:${section}:start -->`;
            const detailsEnd = `<!-- details:${section}:end -->`;

            // Table row
            let block = `${sectionStart}\n`;
            block += `| ${section} | ${status} | ${summary} |\n`;
            block += `${sectionEnd}\n`;
            
            // Detailed findings section (placed after table)
            let detailsBlock = '';
            if (total > 0 && findings) {
              detailsBlock = `${detailsStart}\n`;
              detailsBlock += `\n---\n\n`;
              detailsBlock += `### 📊 ${section}\n\n`;
              detailsBlock += `${findings}\n\n`;
              detailsBlock += `[View full report](https://github.com/${repo}/actions/runs/${runId})\n\n`;
              detailsBlock += `${detailsEnd}\n`;
            }

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const tableHeader = "| Check | Status | Summary |\n|:------|:------:|:--------|\n";
            let baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}`;
            
            // Update or insert table row
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              baseBody = baseBody.replace(re, block);
            } else {
              const headerEnd = baseBody.indexOf('\n', baseBody.indexOf('|:---'));
              if (headerEnd !== -1) {
                baseBody = baseBody.slice(0, headerEnd + 1) + block + baseBody.slice(headerEnd + 1);
              } else {
                baseBody = baseBody + block;
              }
            }
            
            // Update or insert details section
            const hasDetails = baseBody.includes(detailsStart) && baseBody.includes(detailsEnd);
            if (hasDetails) {
              const re = new RegExp(`${detailsStart}[\\s\\S]*?${detailsEnd}\\n?`, "m");
              baseBody = baseBody.replace(re, detailsBlock);
            } else if (detailsBlock) {
              baseBody = baseBody.trimEnd() + '\n' + detailsBlock;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: baseBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: baseBody,
              });
            }

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4naly3er-report
          path: |
            .4naly3er/report.md
            4naly3er-findings.md
          retention-days: 30