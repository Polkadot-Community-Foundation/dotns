name: 4naly3er Analysis

on:
  pull_request:
    branches: [main, develop]
    paths: ['src/**', 'contracts/**', 'foundry.toml', 'remappings.txt']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge install && forge build --build-info

      - uses: actions/checkout@v4
        with:
          repository: Picodes/4naly3er
          path: .4naly3er
      - run: rm -f .4naly3er/src/issues/NC/uselessOverride.ts
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: .4naly3er/yarn.lock
      - working-directory: .4naly3er
        run: yarn install

      - name: Run 4naly3er
        continue-on-error: true
        run: |
          cd .4naly3er
          [ -d "../src" ] && yarn analyze "../src" "" "${{ github.server_url }}/${{ github.repository }}" || \
          [ -d "../contracts" ] && yarn analyze "../contracts" "" "${{ github.server_url }}/${{ github.repository }}" || true

      - name: Process results
        id: run
        run: |
          python3 << 'EOF'
          import os, re
          from collections import defaultdict

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          path = '.4naly3er/report.md'
          if not os.path.exists(path):
              out('success', 'false')
              out('summary', 'No report')
              out('total', '0')
              exit(0)

          content = open(path, 'r', encoding='utf-8').read()
          if not content.strip():
              out('success', 'false')
              out('summary', 'Empty report')
              out('total', '0')
              exit(0)

          findings = defaultdict(list)
          pattern = r'###\s*\[([A-Z]+)-(\d+)\]\s*([^\n]+)'
          for m in re.finditer(pattern, content):
              cat, num, title = m.group(1), m.group(2), m.group(3).strip()
              inst = re.search(r'\*Instances\s*\((\d+)\)\*', content[m.end():m.end()+500])
              findings[cat].append({
                  'id': f'{cat}-{num}',
                  'title': title[:70].replace('|', '-'),
                  'inst': inst.group(1) if inst else '?'
              })

          names = {'H':'High','M':'Medium','L':'Low','G':'Gas','NC':'Non-Critical'}
          icons = {'H':'🔴','M':'🟠','L':'🟡','G':'⛽','NC':'🔵'}
          
          total = sum(len(v) for v in findings.values())
          h, m, l, g, nc = len(findings.get('H',[])), len(findings.get('M',[])), len(findings.get('L',[])), len(findings.get('G',[])), len(findings.get('NC',[]))

          if total == 0:
              out('success', 'true')
              out('summary', 'No issues')
              out('total', '0')
          else:
              parts = []
              if h: parts.append(f'H:{h}')
              if m: parts.append(f'M:{m}')
              if l: parts.append(f'L:{l}')
              if g: parts.append(f'G:{g}')
              if nc: parts.append(f'NC:{nc}')
              out('success', 'false' if h else 'true')
              out('summary', f"{total} issues ({' '.join(parts)})")
              out('total', str(total))

          md = []
          for cat in ['H','M','L','G','NC']:
              items = findings.get(cat, [])
              if not items: continue
              md.append(f"\n**{icons.get(cat,'')} {names.get(cat, cat)} ({len(items)})**\n")
              md.append("| ID | Finding | Instances |")
              md.append("|:---|:--------|:---------:|")
              for x in items[:15]:
                  md.append(f"| `{x['id']}` | {x['title']} | {x['inst']} |")
              if len(items) > 15:
                  md.append(f"| | *+{len(items)-15} more* | |")
          
          open('4naly3er-details.md', 'w').write('\n'.join(md))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 4naly3er-report
          path: |
            .4naly3er/report.md
            4naly3er-details.md
          retention-days: 30

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: 4naly3er Analysis
          SUCCESS: ${{ steps.run.outputs.success }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          TOTAL: ${{ steps.run.outputs.total }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const summary = process.env.SUMMARY || '';
            const total = parseInt(process.env.TOTAL || '0');
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            let status = "✅";
            if (summary.includes('H:')) status = "❌";
            else if (summary.includes('M:') || summary.includes('L:')) status = "⚠️";
            
            let details = '';
            try { details = fs.readFileSync('4naly3er-details.md', 'utf8').trim(); } catch {}
            
            const sectionStart = `<!-- ${section}:start -->`;
            const sectionEnd = `<!-- ${section}:end -->`;
            const detailsStart = `<!-- ${section}-details:start -->`;
            const detailsEnd = `<!-- ${section}-details:end -->`;
            
            const displaySummary = total > 0 ? `${summary} ↓` : summary;
            const row = `| ${section} | ${status} | ${displaySummary} |\n`;
            const block = `${sectionStart}\n${row}${sectionEnd}\n`;
            
            let detailsBlock = '';
            if (total > 0 && details) {
              detailsBlock = `${detailsStart}\n\n---\n\n<details>\n<summary><strong>📊 ${section} Details</strong></summary>\n\n${details}\n\n[View full report](https://github.com/${repo}/actions/runs/${runId})\n\n</details>\n\n${detailsEnd}\n`;
            }

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo: repoName, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            const header = `${marker}\n## CI Summary\n\n| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            let body = existing?.body ?? header;
            
            if (body.includes(sectionStart)) {
              const re = new RegExp(`${sectionStart}\\n[\\s\\S]*?${sectionEnd}\\n`, "m");
              body = body.replace(re, block);
            } else {
              const insertPoint = body.indexOf('\n|:---');
              const insertAfter = body.indexOf('\n', insertPoint + 1);
              body = body.slice(0, insertAfter + 1) + block + body.slice(insertAfter + 1);
            }
            
            if (body.includes(detailsStart)) {
              const re = new RegExp(`${detailsStart}\\n[\\s\\S]*?${detailsEnd}\\n`, "m");
              body = body.replace(re, detailsBlock);
            } else if (detailsBlock) {
              body = body.trimEnd() + '\n' + detailsBlock;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo: repoName, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo: repoName, issue_number, body });
            }