name: 4naly3er Static Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "contracts/**.sol"
      - "foundry.toml"
      - "remappings.txt"
      - ".github/workflows/4naly3er.yml"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Build contracts
        run: forge build --build-info

      - name: Checkout 4naly3er
        uses: actions/checkout@v4
        with:
          repository: Picodes/4naly3er
          path: .4naly3er

      - name: Remove problematic detector
        run: rm -f .4naly3er/src/issues/NC/uselessOverride.ts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"
          cache-dependency-path: .4naly3er/yarn.lock

      - name: Install 4naly3er dependencies
        working-directory: .4naly3er
        run: yarn install

      - name: Run 4naly3er
        continue-on-error: true
        run: |
          cd .4naly3er
          yarn analyze "../contracts" "" "${{ github.server_url }}/${{ github.repository }}" || true
          cd ..

      - name: Process 4naly3er output
        if: always()
        run: |
          python3 << 'EOF'
          import os
          import re

          report_path = '.4naly3er/report.md'
          output_path = '4naly3er-results.md'

          if not os.path.exists(report_path):
              with open(output_path, 'w') as f:
                  f.write('# 4naly3er Analysis Results\n\n4naly3er did not generate a report file.\n')
              exit(0)

          with open(report_path, 'r', encoding='utf-8') as f:
              content = f.read()

          if not content.strip():
              with open(output_path, 'w') as f:
                  f.write('# 4naly3er Analysis Results\n\nReport file is empty.\n')
              exit(0)

          lines = content.split('\n')

          # Count issue headings (rough signal; not exact counts of findings)
          issue_counts = {}
          for line in lines:
              match = re.search(r'###\s*(Low|Medium|High|Gas|NC|Informational)', line, re.IGNORECASE)
              if match:
                  category = match.group(1).capitalize()
                  issue_counts[category] = issue_counts.get(category, 0) + 1

          out = ['# 4naly3er Analysis Results\n']

          if issue_counts:
              out.append('## Summary\n')
              out.append('| Category | Count |')
              out.append('|----------|-------|')
              for category, count in sorted(issue_counts.items()):
                  out.append(f'| {category} | {count} |')
              out.append('\n---\n')

          out.append(content)

          final_output = '\n'.join(out)

          max_length = 65000
          if len(final_output) > max_length:
              final_output = final_output[:max_length] + '\n\n... (report truncated, see artifacts for full report)'

          with open(output_path, 'w', encoding='utf-8') as f:
              f.write(final_output)
          EOF

      - name: Prepare CI summary outputs
        id: run
        if: always()
        shell: bash
        run: |
          set +e

          if [ ! -f 4naly3er-results.md ]; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            echo "4naly3er-results.md not found." >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # If report contains "did not generate" or "empty", mark as failed
          if grep -qiE "did not generate|empty" 4naly3er-results.md; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
          else
            # 4naly3er is continue-on-error; treat presence of a report as passed
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
          fi

          echo "details<<EOF" >> "$GITHUB_OUTPUT"
          tail -n 80 4naly3er-results.md | sed 's/`/\\`/g' >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Update PR summary comment
        if: always() && github.event_name == "pull_request"
        uses: actions/github-script@v7
        env:
          SECTION: 4naly3er Static Analysis
          STATUS: ${{ steps.run.outputs.status }}
          DETAILS: ${{ steps.run.outputs.details }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION ?? "4naly3er Static Analysis";
            const status = process.env.STATUS ?? "❌ Failed";
            const details = process.env.DETAILS ?? "";

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            const block =
              `${sectionStart}\n` +
              `#### ${section}\n` +
              `Status: ${status}\n` +
              (details ? `\n\`\`\`\n${details}\n\`\`\`\n` : "\n") +
              `${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n### CI summary\n\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }

      - name: Upload 4naly3er report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 4naly3er-report
          path: |
            .4naly3er/report.md
            4naly3er-results.md
          retention-days: 30
