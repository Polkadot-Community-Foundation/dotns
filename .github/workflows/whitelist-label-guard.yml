name: Guard Whitelist Approval Label

on:
  issues:
    # `labeled` enforces that only code-owners can apply the approval
    # label in the first place. `edited` invalidates an existing
    # approval whenever the issue body changes, closing the TOCTOU
    # window where an author could rotate the address between approval
    # and `/retry` execution. `unlabeled` lets a code-owner clear the
    # approval explicitly without leaving a stale comment trail.
    types: [labeled, edited]

permissions:
  contents: read
  issues: write

jobs:
  guard-applier:
    if: github.event.action == 'labeled' && github.event.label.name == 'whitelist-approved'
    runs-on: ubuntu-latest
    steps:
      - name: Load CODEOWNERS reviewers
        id: codeowners
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.repository.default_branch,
            });
            const content = Buffer.from(data.content, data.encoding || "base64").toString("utf8");
            const mentions = [...new Set(content.match(/@[A-Za-z0-9-]+(?:\/[A-Za-z0-9_.-]+)?/g) || [])];
            core.setOutput("mentions", mentions.join(" "));

      - name: Remove label if applied by non-code-owner
        uses: actions/github-script@v7
        env:
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const codeOwners = (process.env.REVIEWERS || "")
              .split(/\s+/)
              .filter(owner => owner.startsWith("@") && !owner.includes("/"))
              .map(owner => owner.slice(1));

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const sender = context.payload.sender.login;

            if (codeOwners.includes(sender)) {
              core.info(`${sender} is a code owner — label stays.`);
              return;
            }

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number,
              name: "whitelist-approved",
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                `**@${sender}** attempted to apply the \`whitelist-approved\` label.`,
                "",
                "Only code owners can approve whitelist requests. The label has been removed.",
                "",
                "If you need approval permissions, request to be added as a [code owner](https://github.com/paritytech/dotns/blob/main/.github/CODEOWNERS).",
                "",
                `cc ${process.env.REVIEWERS}`,
              ].join("\n"),
            });

  revoke-on-edit:
    # The whitelist-execute workflow re-extracts the address from the
    # issue body at execution time (label-applied or `/retry`), not at
    # approval time. Without this guard, an issue author could edit the
    # body to a different address after approval and then trigger
    # `/retry` to whitelist the new address on-chain. Stripping
    # `whitelist-approved` on every body edit forces a fresh code-owner
    # review of whatever the body now says before any execution can run.
    if: |
      github.event.action == 'edited' &&
      github.event.changes.body != null &&
      contains(github.event.issue.labels.*.name, 'whitelist-approved')
    runs-on: ubuntu-latest
    steps:
      - name: Load CODEOWNERS reviewers
        id: codeowners
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.repository.default_branch,
            });
            const content = Buffer.from(data.content, data.encoding || "base64").toString("utf8");
            const mentions = [...new Set(content.match(/@[A-Za-z0-9-]+(?:\/[A-Za-z0-9_.-]+)?/g) || [])];
            core.setOutput("mentions", mentions.join(" "));

      - name: Revoke approval on issue body edit
        uses: actions/github-script@v7
        env:
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const editor = context.payload.sender.login;

            await github.rest.issues.removeLabel({
              owner,
              repo,
              issue_number,
              name: "whitelist-approved",
            });

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                `The issue body was edited by **@${editor}** after approval, so the \`whitelist-approved\` label has been revoked.`,
                "",
                "On-chain whitelisting reads the address from the current issue body, so any edit to the body must be re-approved by a code owner before another execution can run.",
                "",
                `cc ${process.env.REVIEWERS}`,
              ].join("\n"),
            });
