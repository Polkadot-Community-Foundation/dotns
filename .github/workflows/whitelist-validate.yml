name: Validate Whitelist Request

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: contains(github.event.issue.labels.*.name, 'whitelist-request')
    runs-on: ubuntu-latest
    env:
      SUBSTRATE_RPC_URL: "wss://asset-hub-paseo-rpc.n.dwellir.com"
      MAX_INVALID_WHITELIST_ATTEMPTS: "3"

    steps:
      - name: Load CODEOWNERS reviewers
        id: codeowners
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.repository.default_branch,
            });
            const content = Buffer.from(data.content, data.encoding || "base64").toString("utf8");
            const mentions = [...new Set(content.match(/@[A-Za-z0-9-]+(?:\/[A-Za-z0-9_.-]+)?/g) || [])];
            core.setOutput("mentions", mentions.join(" "));

      - name: Extract request fields
        id: extract
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";

            function field(name) {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = body.match(new RegExp(`### ${escaped}\\s*\\n([\\s\\S]*?)(?=\\n### |$)`));
              return match ? match[1].trim() : "";
            }

            const address = field("Address").split("\n")[0].trim();
            const addressType = field("Address Type").split("\n")[0].trim();
            const description = field("Description").trim();
            const missing = [];

            if (!address) missing.push("Address");
            if (!["EVM (H160)", "Substrate (SS58)"].includes(addressType)) {
              missing.push("Address Type");
            }
            if (description.length < 30) {
              missing.push("Description (at least 30 characters explaining why the bypass is needed)");
            }

            core.setOutput("address", address);
            core.setOutput("address_type", addressType);
            core.setOutput("description", description);
            core.setOutput("fields_ok", missing.length === 0 ? "true" : "false");
            core.setOutput("missing_fields", missing.join(", "));

      - name: Install dotns CLI
        if: steps.extract.outputs.fields_ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.extract.outputs.fields_ok == 'true'
        run: |
          TAG=$(gh release list --repo paritytech/dotns-sdk --limit 1 --json tagName --jq '.[0].tagName')
          gh release download "$TAG" --repo paritytech/dotns-sdk --pattern '*.tgz' --dir /tmp/dotns-cli
          npm install -g /tmp/dotns-cli/*.tgz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check account mapped
        if: steps.extract.outputs.fields_ok == 'true'
        id: validate
        env:
          ADDRESS: ${{ steps.extract.outputs.address }}
          ADDRESS_TYPE: ${{ steps.extract.outputs.address_type }}
        run: |
          RESULT=$(dotns account is-mapped "$ADDRESS" --rpc "$SUBSTRATE_RPC_URL" --json -k //Alice 2>&1) || true

          if echo "$RESULT" | jq -e . > /dev/null 2>&1; then
            IS_MAPPED=$(echo "$RESULT" | jq -r '.isMapped')
            EVM_ADDRESS=$(echo "$RESULT" | jq -r '.evmAddress')
            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "is_mapped=$IS_MAPPED" >> "$GITHUB_OUTPUT"
            echo "evm_mapped=$EVM_ADDRESS" >> "$GITHUB_OUTPUT"

            if echo "$ADDRESS" | grep -qE '^0x[0-9a-fA-F]{40}$'; then
              echo "type=evm" >> "$GITHUB_OUTPUT"
            else
              echo "type=substrate" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "is_mapped=false" >> "$GITHUB_OUTPUT"
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Build validation message
        id: message
        env:
          ADDRESS: ${{ steps.extract.outputs.address }}
          ADDRESS_TYPE: ${{ steps.extract.outputs.address_type }}
          FIELDS_OK: ${{ steps.extract.outputs.fields_ok }}
          MISSING_FIELDS: ${{ steps.extract.outputs.missing_fields }}
          VALID: ${{ steps.validate.outputs.valid }}
          ADDR_TYPE: ${{ steps.validate.outputs.type }}
          IS_MAPPED: ${{ steps.validate.outputs.is_mapped }}
          EVM_MAPPED: ${{ steps.validate.outputs.evm_mapped }}
        uses: actions/github-script@v7
        with:
          script: |
            const address = process.env.ADDRESS;
            const selectedType = process.env.ADDRESS_TYPE;
            const fieldsOk = process.env.FIELDS_OK === "true";
            const valid = fieldsOk && process.env.VALID === "true";
            const type = process.env.ADDR_TYPE;
            const isMapped = process.env.IS_MAPPED === "true";
            const evmMapped = process.env.EVM_MAPPED || "";
            const missingFields = process.env.MISSING_FIELDS || "";

            let message = "";

            if (!fieldsOk) {
              message = `This whitelist request is incomplete or unclear.\n\n**Needs:** ${missingFields}`;
            } else if (!valid) {
              message = `\`${address}\` is not a valid EVM or Substrate address.`;
            } else if (type === "evm") {
              if (selectedType && selectedType.includes("SS58")) {
                message = `You selected **Substrate (SS58)** but provided an EVM address: \`${address}\`\n\nThis looks like a valid EVM address so we will proceed with it.`;
              } else {
                message = `EVM (H160) address detected: \`${address}\``;
              }
            } else {
              const evmLine = evmMapped ? `\n\n**Mapped EVM address:** \`${evmMapped}\`` : "";
              const mappingWarning = evmMapped && !isMapped
                ? `\n\n> **Account not mapped on-chain.** You must map your account before your address can be whitelisted (see instructions below).`
                : "";

              if (selectedType && selectedType.includes("H160")) {
                message = `You selected **EVM (H160)** but provided a Substrate address: \`${address}\`${evmLine}${mappingWarning}\n\n> The EVM address will be resolved automatically upon approval.`;
              } else {
                message = `Substrate (SS58) address detected: \`${address}\`${evmLine}${mappingWarning}\n\n> The EVM address will be resolved automatically upon approval.`;
              }
            }

            core.setOutput("message", message.replace(/\n/g, "%0A"));

      - name: Comment validation result
        uses: actions/github-script@v7
        env:
          VALID: ${{ steps.validate.outputs.valid }}
          MESSAGE: ${{ steps.message.outputs.message }}
          ADDR_TYPE: ${{ steps.validate.outputs.type }}
          IS_MAPPED: ${{ steps.validate.outputs.is_mapped }}
          MAX_ATTEMPTS: ${{ env.MAX_INVALID_WHITELIST_ATTEMPTS }}
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const marker = "<!-- dotns-whitelist-bot -->";
            const invalidMarker = "<!-- dotns-whitelist-invalid-attempt -->";
            const valid = process.env.VALID === "true";
            const message = process.env.MESSAGE.replace(/%0A/g, "\n");
            const type = process.env.ADDR_TYPE;
            const isMapped = process.env.IS_MAPPED === "true";
            const author = context.payload.issue.user.login;
            const maxAttempts = Number(process.env.MAX_ATTEMPTS || "3");
            const reviewers = process.env.REVIEWERS;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previousInvalidAttempts = comments.filter(c => c.body && c.body.includes(invalidMarker)).length;
            const invalidAttempts = valid ? previousInvalidAttempts : previousInvalidAttempts + 1;
            const closeIssue = !valid && invalidAttempts >= maxAttempts;

            const status = valid ? "Valid" : "Invalid";

            const lines = [
              marker,
              valid ? "" : invalidMarker,
              `### Address Validation — ${status}`,
              "",
              message,
              "",
            ];

            if (valid && type === "substrate" && !isMapped) {
              lines.push(`@${author} Your account is **not mapped on-chain**. Before your address can be whitelisted you need to map it.`);
              lines.push("");
              lines.push("Install the [DotNS CLI](https://github.com/paritytech/dotns-sdk/releases) and run:");
              lines.push("");
              lines.push("```bash");
              lines.push("dotns account map --rpc wss://services.polkadothub-rpc.com/testnet -m \"<your mnemonic>\"");
              lines.push("```");
              lines.push("");
              lines.push("Run `dotns account --help` for all authentication options.");
              lines.push("");
            }

            if (valid) {
              lines.push("This address is ready for whitelisting. A maintainer will review and apply the `whitelist-approved` label to proceed.");
            } else {
              lines.push(`Attempt ${invalidAttempts} of ${maxAttempts}.`);
              lines.push("");
              lines.push("Please update the issue body with a valid EVM or Substrate address, the matching address type, and a clear description of why the PoP bypass is needed.");
            }

            if (closeIssue) {
              lines.push("");
              lines.push(`This request has reached ${maxAttempts} invalid attempts, so it is being closed for review.`);
              lines.push(`cc ${reviewers}`);
            }

            lines.push("");
            lines.push("---");
            lines.push("");
            lines.push("**Available commands:**");
            lines.push("| Command | Description |");
            lines.push("|---------|-------------|");
            lines.push("| `/retry` | Re-trigger whitelisting (after mapping or if a previous attempt failed) |");

            const body = lines.join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });

            if (!valid) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: closeIssue ? ["needs-info", "needs-review"] : ["needs-info"],
              });
            } else {
              try {
                await github.rest.issues.removeLabel({ owner, repo, issue_number, name: "needs-info" });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            if (closeIssue) {
              await github.rest.issues.update({ owner, repo, issue_number, state: "closed" });
            }
