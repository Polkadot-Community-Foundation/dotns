name: Slither Static Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'contracts/**'
      - 'src/**'
      - 'foundry.toml'
      - '.github/workflows/slither.yaml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Build contracts
        run: forge build --build-info

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        continue-on-error: true
        run: |
          slither . \
            --json slither-report.json \
            --filter-paths "lib/|test/" \
            --exclude-dependencies \
            --compile-force-framework foundry \
            || true

      - name: Process Slither output
        id: run
        if: always()
        shell: bash
        run: |
          python3 << 'PYTHON_EOF'
          import json
          import os
          from collections import defaultdict

          def write_output(name, value):
              """Write to GITHUB_OUTPUT safely"""
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  if '\n' in value:
                      # Use a unique delimiter for multiline
                      delim = 'SLITHER_OUTPUT_END_12345'
                      f.write(f"{name}<<{delim}\n{value}\n{delim}\n")
                  else:
                      f.write(f"{name}={value}\n")

          if not os.path.exists('slither-report.json'):
              print("ERROR: slither-report.json not found")
              write_output('status', '❌ Failed')
              write_output('summary', 'No report generated')
              write_output('details', 'Slither did not generate a report file.')
              exit(0)

          try:
              with open('slither-report.json', 'r') as f:
                  content = f.read()
                  if not content.strip():
                      print("ERROR: slither-report.json is empty")
                      write_output('status', '❌ Failed')
                      write_output('summary', 'Empty report')
                      write_output('details', 'Slither report file is empty.')
                      exit(0)
                  data = json.loads(content)
          except json.JSONDecodeError as e:
              print(f"ERROR: Invalid JSON: {e}")
              write_output('status', '❌ Failed')
              write_output('summary', 'Invalid JSON')
              write_output('details', f'Failed to parse Slither report: {str(e)}')
              exit(0)

          findings = defaultdict(list)
          
          for result in data.get('results', {}).get('detectors', []):
              severity = result.get('impact', 'Informational').capitalize()
              findings[severity].append({
                  'check': result.get('check', 'Unknown'),
                  'description': result.get('description', '').strip(),
                  'confidence': result.get('confidence', 'Unknown').capitalize(),
                  'elements': result.get('elements', [])
              })

          severity_order = ['High', 'Medium', 'Low', 'Informational', 'Optimization']
          
          total_issues = sum(len(v) for v in findings.values())
          high_count = len(findings.get('High', []))
          medium_count = len(findings.get('Medium', []))
          low_count = len(findings.get('Low', []))
          
          # Build summary line
          if total_issues == 0:
              summary = 'No issues found'
              status = '✅ Passed'
              details = ''
          else:
              counts = []
              for sev in severity_order:
                  c = len(findings.get(sev, []))
                  if c > 0:
                      counts.append(f'{sev}: {c}')
              summary = ' | '.join(counts)
              
              # Build details with top findings
              detail_lines = [f'Total: {total_issues} issues', '']
              
              if high_count > 0 or medium_count > 0:
                  detail_lines.append('Top findings:')
                  shown = 0
                  for sev in ['High', 'Medium', 'Low']:
                      for issue in findings.get(sev, [])[:3]:
                          if shown >= 5:
                              break
                          desc = issue['description'].replace('\n', ' ')[:80]
                          detail_lines.append(f'  [{sev}] {issue["check"]}: {desc}...')
                          shown += 1
                      if shown >= 5:
                          break
              
              details = '\n'.join(detail_lines)
              
              # Determine status
              if high_count > 0:
                  status = '❌ Failed'
              elif medium_count > 0:
                  status = '⚠️ Warnings'
              else:
                  status = '✅ Passed'

          write_output('status', status)
          write_output('summary', summary)
          write_output('details', details)

          # Generate full markdown report for artifact
          output = ['# Slither Analysis Results\n']
          
          if total_issues == 0:
              output.append('No issues detected.\n')
          else:
              output.append(f'**Total Issues:** {total_issues}\n')
              output.append('## Summary\n')
              output.append('| Severity | Count |')
              output.append('|----------|-------|')
              
              for severity in severity_order:
                  count = len(findings.get(severity, []))
                  if count > 0:
                      output.append(f'| {severity} | {count} |')
              
              output.append('\n## Details\n')
              
              for severity in severity_order:
                  issues = findings.get(severity, [])
                  if not issues:
                      continue
                  
                  output.append(f'\n### {severity} ({len(issues)})\n')
                  
                  for issue in issues:
                      check = issue['check']
                      desc = issue['description']
                      confidence = issue['confidence']
                      
                      locations = []
                      for elem in issue['elements'][:2]:
                          if 'source_mapping' in elem:
                              loc = elem['source_mapping'].get('filename_short', '')
                              line = elem['source_mapping'].get('lines', [])
                              if loc and line:
                                  locations.append(f"{loc}:{line[0] if line else '?'}")
                      
                      location = ', '.join(locations) if locations else 'N/A'
                      
                      output.append(f'**{check}** ({confidence} confidence)')
                      output.append(f'- Location: `{location}`')
                      output.append(f'- {desc[:300]}')
                      output.append('')

          with open('slither-results.md', 'w') as f:
              f.write('\n'.join(output))
          
          print(f"Generated report: {total_issues} issues ({status})")
          PYTHON_EOF

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Slither Analysis
          STATUS: ${{ steps.run.outputs.status }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          DETAILS: ${{ steps.run.outputs.details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const tableHeader = "| Check | Status | Summary |\n|-------|--------|---------|";
            
            const section = process.env.SECTION;
            const status = process.env.STATUS || "❌ Failed";
            const summary = process.env.SUMMARY || "";
            const details = process.env.DETAILS || "";
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| **${section}** | ${status} | ${summary} |\n`;

            if (details.trim()) {
              block += `<details><summary>📋 Details</summary>\n\n\`\`\`\n${details.trim()}\n\`\`\`\n\n`;
              block += `[View full logs](https://github.com/${repo}/actions/runs/${runId})\n</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            slither-report.json
            slither-results.md
          retention-days: 30