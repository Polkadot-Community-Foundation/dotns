name: Slither Analysis

on:
  pull_request:
    branches: [main, develop]
    paths: ['contracts/**', 'src/**', 'foundry.toml']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge install && forge build --build-info
      - run: pip3 install slither-analyzer

      - name: Run Slither
        continue-on-error: true
        run: |
          slither . --json slither.json --filter-paths "lib/|test/" \
            --exclude-dependencies --compile-force-framework foundry || true

      - name: Process results
        id: run
        run: |
          python3 << 'EOF'
          import json, os
          from collections import defaultdict

          out = lambda k,v: open(os.environ['GITHUB_OUTPUT'], 'a').write(f"{k}={v}\n")

          if not os.path.exists('slither.json'):
              out('success', 'false')
              out('summary', 'No report')
              out('total', '0')
              exit(0)

          data = json.load(open('slither.json'))
          findings = defaultdict(list)
          
          for d in data.get('results', {}).get('detectors', []):
              sev = d.get('impact', 'Info').capitalize()
              loc = ''
              for e in d.get('elements', [])[:1]:
                  sm = e.get('source_mapping', {})
                  if sm.get('filename_short') and sm.get('lines'):
                      loc = f"{sm['filename_short']}:{sm['lines'][0]}"
              findings[sev].append({
                  'check': d.get('check', '?'),
                  'desc': d.get('description', '')[:100].replace('|', '-').replace('\n', ' '),
                  'loc': loc
              })

          total = sum(len(v) for v in findings.values())
          h, m, l, i = len(findings.get('High',[])), len(findings.get('Medium',[])), len(findings.get('Low',[])), len(findings.get('Informational',[]))

          if total == 0:
              out('success', 'true')
              out('summary', 'No issues')
              out('total', '0')
          else:
              parts = []
              if h: parts.append(f'H:{h}')
              if m: parts.append(f'M:{m}')
              if l: parts.append(f'L:{l}')
              if i: parts.append(f'I:{i}')
              out('success', 'false' if h else 'true')
              out('summary', f"{total} issues ({' '.join(parts)})")
              out('total', str(total))

          md = []
          icons = {'High':'🔴','Medium':'🟠','Low':'🟡','Informational':'🔵'}
          for sev in ['High','Medium','Low','Informational']:
              items = findings.get(sev, [])
              if not items: continue
              md.append(f"\n**{icons.get(sev,'')} {sev} ({len(items)})**\n")
              md.append("| Check | Description | Location |")
              md.append("|:------|:------------|:---------|")
              for x in items[:10]:
                  md.append(f"| `{x['check']}` | {x['desc']} | `{x['loc']}` |")
              if len(items) > 10:
                  md.append(f"| | *+{len(items)-10} more* | |")
          
          open('slither-details.md', 'w').write('\n'.join(md))
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slither-report
          path: |
            slither.json
            slither-details.md
          retention-days: 30

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Slither Analysis
          SUCCESS: ${{ steps.run.outputs.success }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          TOTAL: ${{ steps.run.outputs.total }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const summary = process.env.SUMMARY || '';
            const total = parseInt(process.env.TOTAL || '0');
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            let status = "✅";
            if (summary.includes('H:')) status = "❌";
            else if (summary.includes('M:') || summary.includes('L:')) status = "⚠️";
            
            let details = '';
            try { details = fs.readFileSync('slither-details.md', 'utf8').trim(); } catch {}
            
            const sectionStart = `<!-- ${section}:start -->`;
            const sectionEnd = `<!-- ${section}:end -->`;
            const detailsStart = `<!-- ${section}-details:start -->`;
            const detailsEnd = `<!-- ${section}-details:end -->`;
            
            const displaySummary = total > 0 ? `${summary} ↓` : summary;
            const row = `| ${section} | ${status} | ${displaySummary} |\n`;
            const block = `${sectionStart}\n${row}${sectionEnd}\n`;
            
            let detailsBlock = '';
            if (total > 0 && details) {
              detailsBlock = `${detailsStart}\n\n---\n\n<details>\n<summary><strong>🔍 ${section} Details</strong></summary>\n\n${details}\n\n[View full report](https://github.com/${repo}/actions/runs/${runId})\n\n</details>\n\n${detailsEnd}\n`;
            }

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo: repoName, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            const header = `${marker}\n## CI Summary\n\n| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            let body = existing?.body ?? header;
            
            if (body.includes(sectionStart)) {
              const re = new RegExp(`${sectionStart}\\n[\\s\\S]*?${sectionEnd}\\n`, "m");
              body = body.replace(re, block);
            } else {
              const insertPoint = body.indexOf('\n|:---');
              const insertAfter = body.indexOf('\n', insertPoint + 1);
              body = body.slice(0, insertAfter + 1) + block + body.slice(insertAfter + 1);
            }
            
            if (body.includes(detailsStart)) {
              const re = new RegExp(`${detailsStart}\\n[\\s\\S]*?${detailsEnd}\\n`, "m");
              body = body.replace(re, detailsBlock);
            } else if (detailsBlock) {
              body = body.trimEnd() + '\n' + detailsBlock;
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo: repoName, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo: repoName, issue_number, body });
            }