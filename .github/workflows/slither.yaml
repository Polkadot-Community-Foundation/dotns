name: Slither Static Analysis

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'contracts/**.sol'
      - 'foundry.toml'
      - '.github/workflows/slither.yml'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  analyse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Build contracts
        run: forge build --build-info

      - name: Install Slither
        run: pip3 install slither-analyzer

      - name: Run Slither
        continue-on-error: true
        run: |
          slither . \
            --json slither-report.json \
            --filter-paths "lib/|test/" \
            --exclude-dependencies \
            --compile-force-framework foundry \
            || true

      - name: Process Slither output
        if: always()
        run: |
          python3 << 'EOF'
          import json
          import os
          from collections import defaultdict

          if not os.path.exists('slither-report.json'):
              print("ERROR: slither-report.json not found")
              with open('slither-summary.txt', 'w') as f:
                  f.write('Slither did not generate a report file.')
              with open('slither-status.txt', 'w') as f:
                  f.write('❌ Failed')
              exit(0)

          try:
              with open('slither-report.json', 'r') as f:
                  content = f.read()
                  if not content.strip():
                      print("ERROR: slither-report.json is empty")
                      with open('slither-summary.txt', 'w') as f:
                          f.write('Slither report file is empty.')
                      with open('slither-status.txt', 'w') as f:
                          f.write('❌ Failed')
                      exit(0)
                  data = json.loads(content)
          except json.JSONDecodeError as e:
              print(f"ERROR: Invalid JSON: {e}")
              with open('slither-summary.txt', 'w') as f:
                  f.write(f'Failed to parse Slither report: {str(e)}')
              with open('slither-status.txt', 'w') as f:
                  f.write('❌ Failed')
              exit(0)

          findings = defaultdict(list)
          
          for result in data.get('results', {}).get('detectors', []):
              severity = result.get('impact', 'Informational').capitalize()
              findings[severity].append({
                  'check': result.get('check', 'Unknown'),
                  'description': result.get('description', '').strip(),
                  'confidence': result.get('confidence', 'Unknown').capitalize(),
                  'elements': result.get('elements', [])
              })

          severity_order = ['High', 'Medium', 'Low', 'Informational', 'Optimization']
          
          total_issues = sum(len(v) for v in findings.values())
          high_count = len(findings.get('High', []))
          medium_count = len(findings.get('Medium', []))
          
          summary_lines = []
          
          if total_issues == 0:
              summary_lines.append('No issues detected.')
              status = '✅ Passed'
          else:
              summary_lines.append(f'Total: {total_issues} issues')
              counts = []
              for sev in severity_order:
                  c = len(findings.get(sev, []))
                  if c > 0:
                      counts.append(f'{sev}: {c}')
              summary_lines.append(' | '.join(counts))
              
              # Show top 5 high/medium issues in details
              if high_count > 0 or medium_count > 0:
                  summary_lines.append('')
                  summary_lines.append('Top findings:')
                  shown = 0
                  for sev in ['High', 'Medium']:
                      for issue in findings.get(sev, [])[:3]:
                          if shown >= 5:
                              break
                          desc = issue['description'].replace('\n', ' ')[:100]
                          summary_lines.append(f'  [{sev}] {issue["check"]}: {desc}...')
                          shown += 1
              
              # Mark as failed only for high severity issues
              if high_count > 0:
                  status = '❌ Failed'
              else:
                  status = '⚠️ Passed with warnings'

          with open('slither-summary.txt', 'w') as f:
              f.write('\n'.join(summary_lines))
          
          with open('slither-status.txt', 'w') as f:
              f.write(status)

          # Also generate full markdown report for artifact
          output = ['# Slither Analysis Results\n']
          
          if total_issues == 0:
              output.append('No issues detected.\n')
          else:
              output.append(f'**Total Issues:** {total_issues}\n')
              output.append('## Summary\n')
              output.append('| Severity | Count |')
              output.append('|----------|-------|')
              
              for severity in severity_order:
                  count = len(findings.get(severity, []))
                  if count > 0:
                      output.append(f'| {severity} | {count} |')
              
              output.append('\n## Details\n')
              
              for severity in severity_order:
                  issues = findings.get(severity, [])
                  if not issues:
                      continue
                  
                  output.append(f'\n### {severity} ({len(issues)})\n')
                  output.append('| Check | Description | Confidence | Location |')
                  output.append('|-------|-------------|------------|----------|')
                  
                  for issue in issues:
                      check = issue['check'].replace('|', '\\|')
                      desc = issue['description'].replace('\n', ' ').replace('|', '\\|')[:150]
                      if len(issue['description']) > 150:
                          desc += '...'
                      confidence = issue['confidence']
                      
                      locations = []
                      for elem in issue['elements'][:2]:
                          if 'source_mapping' in elem:
                              loc = elem['source_mapping'].get('filename_short', '')
                              line = elem['source_mapping'].get('lines', [])
                              if loc and line:
                                  locations.append(f"{loc}:{line[0] if line else '?'}")
                      
                      location = '<br>'.join(locations) if locations else 'N/A'
                      output.append(f'| {check} | {desc} | {confidence} | {location} |')

          with open('slither-results.md', 'w') as f:
              f.write('\n'.join(output))
          
          print(f"Successfully generated report with {total_issues} issues")
          EOF

      - name: Prepare CI summary outputs
        id: run
        if: always()
        shell: bash
        run: |
          if [ -f slither-status.txt ]; then
            STATUS=$(cat slither-status.txt)
          else
            STATUS="❌ Failed"
          fi

          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          if [ -f slither-summary.txt ]; then
            echo "details<<EOF" >> "$GITHUB_OUTPUT"
            cat slither-summary.txt >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "details=Slither analysis did not complete." >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Slither Analysis
          STATUS: ${{ steps.run.outputs.status }}
          DETAILS: ${{ steps.run.outputs.details }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION ?? "Slither Analysis";
            const status = process.env.STATUS ?? "❌ Failed";
            const details = process.env.DETAILS ?? "";

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            const block =
              `${sectionStart}\n` +
              `#### ${section}\n` +
              `Status: ${status}\n` +
              (details ? `\n\`\`\`\n${details}\n\`\`\`\n` : "\n") +
              `${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n### CI Summary\n\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }

      - name: Upload Slither report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-report
          path: |
            slither-report.json
            slither-results.md
          retention-days: 30