name: Publish Release Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      - run: bun install

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge build --sizes

      - name: Run tests
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge test -vv

      - name: Extract ABIs
        run: |
          mkdir -p release/abis

          contracts=(
            "StoreFactory"
            "Store"
            "DotnsRegistrar"
            "DotnsReverseResolver"
            "DotnsRegistry"
            "DotnsContentResolver"
            "DotnsResolver"
            "PopRules"
            "DotnsRegistrarController"
            "DotnsProtocolRegistry"
            "IStore"
            "IStoreFactory"
            "IDotnsRegistrar"
            "IDotnsRegistrarController"
            "IDotnsRegistry"
            "IDotnsReverseResolver"
            "IDotnsContentResolver"
            "IDotnsResolver"
            "IPopRules"
            "IDotnsProtocolRegistry"
            "StoreUtils"
            "StringUtils"
          )

          for name in "${contracts[@]}"; do
            abi_file="out/${name}.sol/${name}.json"
            if [ -f "$abi_file" ]; then
              jq '.abi' "$abi_file" > "release/abis/${name}.json"
              echo "Extracted ${name}"
            else
              echo "Error: ${abi_file} not found"
              exit 1
            fi
          done

      - name: Package release artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd release
          zip -r "../dotns-abis-${TAG}.zip" abis/

      - name: Generate release body
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONTRACTS=$(ls release/abis/ | sed 's/\.json$//' | sort)
          COUNT=$(echo "$CONTRACTS" | wc -l | tr -d ' ')
          LIST=$(echo "$CONTRACTS" | sed 's/^/- `/' | sed 's/$/`/')

          cat > release-body.md << EOF
          ## DotNS ABI Package

          **\`dotns-abis-${TAG}.zip\`** contains the compiled ABI JSON files for all DotNS contracts.

          ### Contents (${COUNT} contracts)

          ${LIST}

          ### Usage

          1. Download and extract \`dotns-abis-${TAG}.zip\`
          2. Import the ABI JSON files into your project
          3. Use with any EVM-compatible SDK (viem, ethers, web3.js) to interact with DotNS contracts

          \`\`\`ts
          import StoreAbi from "./abis/Store.json";
          import RegistrarAbi from "./abis/DotnsRegistrar.json";
          \`\`\`
          EOF

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' release-body.md

      - name: Create release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dotns-abis-*.zip
          body_path: release-body.md
          draft: true
          prerelease: true
          generate_release_notes: true
