name: Publish Beta Package

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

# Two runs for the same tag would race to attach assets to the same draft.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  beta-release:
    runs-on: ubuntu-latest
    steps:
      - name: Reject a pre-published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          state=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft --jq '.isDraft' 2>/dev/null || echo absent)
          if [ "$state" = "false" ]; then
            echo "::error::Pre-release $TAG is already published and its assets are locked; use this workflow with a different version tag."
            exit 1
          fi
          echo "Release $TAG is $state; assets can still be attached."

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
          no-cache: true

      # `openzeppelin-foundry-upgrades` shells out to `npx @openzeppelin/upgrades-core`
      # via `vm.ffi` during tests; bun does not provide `npx`, so install Node here.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: bun install

      - name: Build contracts
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        # Remove any prior build-info so the OZ validator (vm.ffi inside
        # upgrade tests in the next step) reads the complete artefact this
        # build emits. Preserving `cache/` keeps incremental compile fast.
        run: rm -rf out/build-info && forge build --sizes

      - name: Run tests
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge test -vv

      - name: Extract ABIs
        run: |
          mkdir -p release/abis

          while IFS= read -r name || [ -n "$name" ]; do
            case "$name" in '' | '#'*) continue ;; esac
            abi_file="out/${name}.sol/${name}.json"
            if [ ! -f "$abi_file" ]; then
              echo "::error::${abi_file} not found"
              exit 1
            fi
            jq '.abi' "$abi_file" > "release/abis/${name}.json"
            echo "Extracted ${name}"
          done < .github/abi-contracts.txt

          # Record what the build actually produced, so the post-upload check compares
          # against it rather than against a second hand-maintained list.
          ls -1 release/abis | sort > release/expected-assets.txt
          echo "Extracted $(wc -l < release/expected-assets.txt) ABIs"

      - name: Package pre-release artifacts
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd release
          zip -r "../dotns-abis-${TAG}.zip" abis/

      - name: Generate release body
        run: |
          TAG="${GITHUB_REF_NAME}"

          cat > release-body.md << 'ENDOFBODY'
          ## DotNS ABI Package (Pre-release)

          > **This is a pre-release.** ABIs may change before the stable release.

          **Contracts**
          | Contract | ABI |
          |----------|-----|
          ENDOFBODY

          for f in release/abis/*.json; do
            name=$(basename "$f" .json)
            echo "          | \`${name}\` | [${name}.json](dotns-abis-${TAG}.zip) |" >> release-body.md
          done

          cat >> release-body.md << 'ENDOFBODY'

          ### Download

          - **All ABIs (zip):** `dotns-abis-${TAG}.zip`
          - **Individual ABIs:** Each contract ABI is also attached as a separate artifact

          ### Usage

          ```ts
          import StoreAbi from "./abis/Store.json";
          import RegistrarAbi from "./abis/DotnsRegistrar.json";
          ```
          ENDOFBODY

          sed -i 's/^          //' release-body.md

      - name: Create draft pre-release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dotns-abis-*.zip
            release/abis/*.json
          body_path: release-body.md
          draft: true
          prerelease: true
          generate_release_notes: true

      - name: Verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          TAG="${GITHUB_REF_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort > "$RUNNER_TEMP/actual-assets.txt"
          { cat release/expected-assets.txt; echo "dotns-abis-${TAG}.zip"; } \
            | sort > "$RUNNER_TEMP/wanted-assets.txt"
          if ! diff -u "$RUNNER_TEMP/wanted-assets.txt" "$RUNNER_TEMP/actual-assets.txt"; then
            echo "::error::Draft pre-release $TAG does not carry the expected asset set; leaving it unpublished."
            exit 1
          fi
          echo "Verified $(wc -l < "$RUNNER_TEMP/wanted-assets.txt") assets on draft $TAG."

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          echo "Published $TAG with its complete asset set."
