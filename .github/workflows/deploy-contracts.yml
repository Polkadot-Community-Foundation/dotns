name: Deploy Contracts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"
      - uses: foundry-rs/foundry-toolchain@v1
      - run: chmod +x setup.bash
      - run: bun install

      - name: Start Anvil
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          anvil --chain-id 420420420 --port 8545 &
          sleep 3
          for i in {1..30}; do
            curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q "result" && exit 0
            sleep 2
          done
          exit 1

      - name: Deploy
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          bun run deploy:anvil > deploy.log 2>&1
          CODE=$?
          ARTIFACT="deployments/paseo-local/420420420.json"
          if [ $CODE -eq 0 ] && [ -f "$ARTIFACT" ]; then
            COUNT=$(jq 'keys | length' "$ARTIFACT" 2>/dev/null || echo "0")
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "summary=${COUNT} contracts deployed" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "summary=Deployment failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deploy-logs
          path: |
            deploy.log
            deployments/
          retention-days: 7

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Deploy Contracts
          SUCCESS: ${{ steps.run.outputs.success }}
          SUMMARY: ${{ steps.run.outputs.summary }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const status = success ? "✅" : "❌";
            const summary = process.env.SUMMARY || (success ? "Passed" : "Failed");
            
            const sectionStart = `<!-- ${section}:start -->`;
            const sectionEnd = `<!-- ${section}:end -->`;
            const row = `| ${section} | ${status} | ${summary} |\n`;
            const block = `${sectionStart}\n${row}${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            const header = `${marker}\n## CI Summary\n\n| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            let body = existing?.body ?? header;
            
            if (body.includes(sectionStart)) {
              const re = new RegExp(`${sectionStart}\\n[\\s\\S]*?${sectionEnd}\\n`, "m");
              body = body.replace(re, block);
            } else {
              const insertPoint = body.indexOf('\n|:---');
              const insertAfter = body.indexOf('\n', insertPoint + 1);
              body = body.slice(0, insertAfter + 1) + block + body.slice(insertAfter + 1);
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Stop Anvil
        if: always()
        run: pkill -f anvil || true