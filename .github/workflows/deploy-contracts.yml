name: Deploy Contracts and Verify artifacts

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.6"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Make scripts executable
        run: chmod +x setup.bash

      - name: Install dependencies
        run: bun install

      - name: Start Anvil
        run: |
          anvil --chain-id 420420420 --port 8545 > anvil.log 2>&1 &
          echo $! > anvil.pid
          sleep 3

      - name: Wait for RPC to be ready
        run: |
          set -e
          for i in {1..30}; do
            if curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q "result"; then
              echo "✓ RPC ready"
              exit 0
            fi
            sleep 2
          done
          echo "RPC not ready after waiting"
          exit 1

      - name: Deploy + verify artifact (capture logs)
        id: run
        shell: bash
        run: |
          set +e

          bun run deploy:anvil > deploy.log 2>&1
          DEPLOY_CODE=$?

          ARTIFACT_PATH="deployments/paseo-local/420420420.json"
          
          if [ $DEPLOY_CODE -eq 0 ] && [ -f "$ARTIFACT_PATH" ]; then
            # Extract deployed contract count
            CONTRACT_COUNT=$(jq 'keys | length' "$ARTIFACT_PATH" 2>/dev/null || echo "?")
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
            echo "summary=${CONTRACT_COUNT} contracts deployed" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=❌ Failed" >> "$GITHUB_OUTPUT"

          if [ $DEPLOY_CODE -ne 0 ]; then
            echo "summary=Deployment script failed" >> "$GITHUB_OUTPUT"
          else
            echo "summary=Missing deployment artifact" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "details<<EOF"

            if [ $DEPLOY_CODE -ne 0 ]; then
              echo "### Deployment Logs"
              tail -n 60 deploy.log
              echo ""
            fi

            if [ ! -f "$ARTIFACT_PATH" ]; then
              echo "### Missing Artifact"
              echo "Expected: $ARTIFACT_PATH"
              echo ""
              echo "Directory contents:"
              ls -la deployments/paseo-local 2>/dev/null || echo "(directory not found)"
            fi

            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          exit 1

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-logs
          path: |
            deploy.log
            anvil.log
            deployments/
          retention-days: 7

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Deploy Contracts
          STATUS: ${{ steps.run.outputs.status }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          DETAILS: ${{ steps.run.outputs.details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const tableHeader = "| Check | Status | Summary |\n|-------|--------|---------|";
            
            const section = process.env.SECTION;
            const status = process.env.STATUS || "❌ Failed";
            const summary = process.env.SUMMARY || "";
            const details = process.env.DETAILS || "";
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| **${section}** | ${status} | ${summary} |\n`;

            if (details.trim()) {
              block += `<details><summary>📋 Details</summary>\n\n\`\`\`\n${details.trim()}\n\`\`\`\n\n`;
              block += `[View full logs](https://github.com/${repo}/actions/runs/${runId})\n</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

      - name: Stop Anvil
        if: always()
        run: |
          if [ -f anvil.pid ]; then
            kill "$(cat anvil.pid)" || true
          fi
          pkill -f anvil || true