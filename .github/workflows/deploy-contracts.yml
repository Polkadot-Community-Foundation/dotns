name: Deploy Contracts and Verify artifacts
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Make scripts executable
        run: chmod +x setup.bash

      - name: Install dependencies
        run: bun install

      - name: Start Anvil
        run: |
          anvil --chain-id 420420420 --port 8545 &
          sleep 3

      - name: Wait for RPC to be ready
        run: |
          for i in {1..30}; do
            if curl -s -X POST -H "Content-Type: application/json" \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:8545 | grep -q "result"; then
              echo "✓ RPC ready"
              break
            fi
            sleep 2
          done

      - name: Deploy contracts
        run: bun run deploy:anvil

      - name: Verify deployment artifact exists
        run: |
          [ -f deployments/paseo-local/420420420.json ] || exit 1

      - name: Stop Anvil
        if: always()
        run: pkill -f anvil || true