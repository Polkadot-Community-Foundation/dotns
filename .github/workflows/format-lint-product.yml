name: Format & Lint

on:
  pull_request:
    paths: ['src/**', 'script/**', 'test/**', '**.sol']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install

      - name: Check formatting
        id: format
        continue-on-error: true
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge fmt --check > format.log 2>&1 || echo "FORMAT_FAILED=true" >> $GITHUB_ENV

      - name: Build contracts
        id: build
        continue-on-error: true
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: forge build --sizes > build.log 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Prepare outputs
        id: run
        if: always()
        run: |
          if [ "${FORMAT_FAILED:-}" = "true" ] || [ "${BUILD_FAILED:-}" = "true" ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            [ "${FORMAT_FAILED:-}" = "true" ] && echo "format_failed=true" >> "$GITHUB_OUTPUT"
            [ "${BUILD_FAILED:-}" = "true" ] && echo "build_failed=true" >> "$GITHUB_OUTPUT"
          else
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-logs
          path: '*.log'
          retention-days: 7

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Format & Lint
          SUCCESS: ${{ steps.run.outputs.success }}
          FORMAT_FAILED: ${{ steps.run.outputs.format_failed }}
          BUILD_FAILED: ${{ steps.run.outputs.build_failed }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const formatFailed = process.env.FORMAT_FAILED === 'true';
            const buildFailed = process.env.BUILD_FAILED === 'true';

            const status = success ? "✅" : "❌";
            let summary = "All checks passed";
            if (!success) {
              const issues = [];
              if (formatFailed) issues.push("formatting");
              if (buildFailed) issues.push("build");
              summary = issues.join(" & ") + " failed";
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            if (existing?.body) {
              const rowRegex = /^\| ([^|]+) \| ([^|]+) \| ([^|]+) \|$/gm;
              let match;
              while ((match = rowRegex.exec(existing.body)) !== null) {
                const name = match[1].trim();
                if (name && name !== 'Check' && !name.startsWith(':')) {
                  rows[name] = { status: match[2].trim(), summary: match[3].trim() };
                }
              }
              const detailsMatch = existing.body.match(/\n---\n[\s\S]*$/);
              if (detailsMatch) detailsSection = detailsMatch[0];
            }

            rows[section] = { status, summary };

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key].status} | ${rows[key].summary} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if checks failed
        if: env.FORMAT_FAILED == 'true' || env.BUILD_FAILED == 'true'
        run: exit 1