name: Format & Lint Solidity Contracts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'script/**'
      - 'test/**'
      - '**.sol'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-contracts:
    name: Format & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install

      - name: Check Solidity formatting
        id: format
        continue-on-error: true
        run: |
          forge fmt --check > format-output.txt 2>&1 || echo "FORMAT_FAILED=true" >> $GITHUB_ENV

      - name: Build contracts
        id: build
        continue-on-error: true
        run: |
          forge build --sizes > build-output.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Prepare CI summary outputs
        id: run
        if: always()
        shell: bash
        run: |
          set +e

          FORMAT_FAILED="${FORMAT_FAILED:-false}"
          BUILD_FAILED="${BUILD_FAILED:-false}"

          # Count unformatted files
          UNFORMATTED_COUNT=0
          if [ -f format-output.txt ]; then
            UNFORMATTED_COUNT=$(grep -c "Diff in" format-output.txt || echo "0")
          fi

          if [ "$FORMAT_FAILED" = "true" ] || [ "$BUILD_FAILED" = "true" ]; then
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            
            if [ "$FORMAT_FAILED" = "true" ] && [ "$BUILD_FAILED" = "true" ]; then
              echo "summary=Format (${UNFORMATTED_COUNT} files) + build failed" >> "$GITHUB_OUTPUT"
            elif [ "$FORMAT_FAILED" = "true" ]; then
              echo "summary=${UNFORMATTED_COUNT} files need formatting" >> "$GITHUB_OUTPUT"
            else
              echo "summary=Compilation failed" >> "$GITHUB_OUTPUT"
            fi

            {
              echo "details<<EOF"

              if [ "$FORMAT_FAILED" = "true" ]; then
                echo "### Formatting Issues"
                echo "Run \`forge fmt\` to fix these files:"
                echo ""
                head -n 30 format-output.txt 2>/dev/null || echo "(no output)"
                echo ""
              fi

              if [ "$BUILD_FAILED" = "true" ]; then
                echo "### Build Errors"
                grep -A 3 "Error\|error" build-output.txt | head -40 || tail -n 40 build-output.txt
              fi

              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
            echo "summary=All checks passed" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-lint-outputs
          path: |
            format-output.txt
            build-output.txt
          retention-days: 7

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Format & Lint
          STATUS: ${{ steps.run.outputs.status }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          DETAILS: ${{ steps.run.outputs.details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const tableHeader = "| Check | Status | Summary |\n|-------|--------|---------|";
            
            const section = process.env.SECTION;
            const status = process.env.STATUS || "❌ Failed";
            const summary = process.env.SUMMARY || "";
            const details = process.env.DETAILS || "";
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| **${section}** | ${status} | ${summary} |\n`;

            if (details.trim()) {
              block += `<details><summary>📋 Details</summary>\n\n\`\`\`\n${details.trim()}\n\`\`\`\n\n`;
              block += `[View full logs](https://github.com/${repo}/actions/runs/${runId})\n</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

      - name: Fail workflow if checks failed
        if: env.FORMAT_FAILED == 'true' || env.BUILD_FAILED == 'true'
        run: |
          echo "One or more checks failed"
          exit 1