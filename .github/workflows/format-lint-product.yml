name: Format & Lint Solidity Contracts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'script/**'
      - 'test/**'
      - '**.sol'

permissions:
  contents: read
  pull-requests: write

jobs:
  format-check:
    name: Check Solidity formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Display Foundry version
        run: |
          forge --version
          cast --version

      - name: Check Solidity formatting
        id: format-check
        continue-on-error: true
        run: |
          echo "Running forge fmt --check on all Solidity files..."
          forge fmt --check > format-output.txt 2>&1 || echo "FORMAT_FAILED=true" >> $GITHUB_ENV
          cat format-output.txt

      - name: Process format results
        if: always()
        run: |
          if [ "$FORMAT_FAILED" = "true" ]; then
            echo "has_issues=true" >> $GITHUB_OUTPUT
            echo "## ❌ Formatting Issues Detected" > format-comment.md
            echo "" >> format-comment.md
            echo "The following files need formatting:" >> format-comment.md
            echo "" >> format-comment.md
            echo '```' >> format-comment.md
            cat format-output.txt >> format-comment.md
            echo '```' >> format-comment.md
            echo "" >> format-comment.md
            echo "**Fix:** Run \`forge fmt\` locally to fix formatting issues." >> format-comment.md
          else
            echo "has_issues=false" >> $GITHUB_OUTPUT
            echo "## ✅ All Solidity files are properly formatted" > format-comment.md
          fi

      - name: Comment PR with format results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('format-comment.md')) {
              console.log('No format comment file found');
              return;
            }
            
            const comment = fs.readFileSync('format-comment.md', 'utf8');
            const commentBody = `${comment}\n\n---\nCommit: ${context.sha.substring(0, 7)}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Formatting Issues Detected') || comment.body.includes('properly formatted')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing format check comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new format check comment');
            }

      - name: Fail if formatting issues exist
        if: env.FORMAT_FAILED == 'true'
        run: exit 1

  lint-check:
    name: Lint Solidity contracts
    runs-on: ubuntu-latest
    needs: format-check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Display Foundry version
        run: |
          forge --version
          cast --version

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Display Bun version
        run: bun --version

      - name: Install project dependencies
        run: |
          echo "Installing dependencies with Bun..."
          bun install --verbose

      - name: Build contracts with Foundry
        id: build
        continue-on-error: true
        run: |
          echo "Building Solidity contracts..."
          forge build --sizes 2>&1 | tee build-output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Process build results
        if: always()
        run: |
          if [ "$BUILD_FAILED" = "true" ]; then
            echo "## ❌ Contract Compilation Failed" > lint-comment.md
            echo "" >> lint-comment.md
            echo "Compilation errors detected:" >> lint-comment.md
            echo "" >> lint-comment.md
            echo '```' >> lint-comment.md
            # Extract error messages (last 100 lines or actual errors)
            if grep -q "Error" build-output.txt; then
              grep -A 5 "Error" build-output.txt | head -100 >> lint-comment.md
            else
              tail -100 build-output.txt >> lint-comment.md
            fi
            echo '```' >> lint-comment.md
            echo "" >> lint-comment.md
            echo "**Action required:** Fix compilation errors before merging." >> lint-comment.md
          else
            echo "## ✅ All contracts compiled successfully" > lint-comment.md
            echo "" >> lint-comment.md
            # Extract contract sizes if available
            if grep -q "Contract" build-output.txt; then
              echo "<details>" >> lint-comment.md
              echo "<summary>Contract Sizes</summary>" >> lint-comment.md
              echo "" >> lint-comment.md
              echo '```' >> lint-comment.md
              grep -A 50 "Contract" build-output.txt | head -50 >> lint-comment.md
              echo '```' >> lint-comment.md
              echo "</details>" >> lint-comment.md
            fi
          fi

      - name: Comment PR with build results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            if (!fs.existsSync('lint-comment.md')) {
              console.log('No lint comment file found');
              return;
            }
            
            const comment = fs.readFileSync('lint-comment.md', 'utf8');
            const commentBody = `${comment}\n\n---\nCommit: ${context.sha.substring(0, 7)}`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.login === 'github-actions[bot]' &&
              (comment.body.includes('Contract Compilation') || comment.body.includes('compiled successfully'))
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log('Updated existing build check comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody
              });
              console.log('Created new build check comment');
            }

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-output.txt
          retention-days: 7

      - name: Fail if build failed
        if: env.BUILD_FAILED == 'true'
        run: exit 1