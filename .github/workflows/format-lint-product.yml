name: Format & Lint Solidity Contracts

on:
  pull_request:
    paths:
      - 'src/**'
      - 'script/**'
      - 'test/**'
      - '**.sol'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-contracts:
    name: Format & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry toolchain
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Setup Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install project dependencies
        run: bun install

      - name: Check Solidity formatting
        id: format
        continue-on-error: true
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          forge fmt --check > format-output.txt 2>&1 || echo "FORMAT_FAILED=true" >> $GITHUB_ENV

      - name: Build contracts
        id: build
        continue-on-error: true
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          forge build --sizes > build-output.txt 2>&1 || echo "BUILD_FAILED=true" >> $GITHUB_ENV

      - name: Prepare outputs
        id: run
        if: always()
        shell: bash
        run: |
          FORMAT_FAILED="${FORMAT_FAILED:-false}"
          BUILD_FAILED="${BUILD_FAILED:-false}"

          UNFORMATTED_COUNT=0
          if [ -f format-output.txt ]; then
            UNFORMATTED_COUNT=$(grep -c "Diff in" format-output.txt 2>/dev/null || echo "0")
          fi

          if [ "$FORMAT_FAILED" = "true" ] || [ "$BUILD_FAILED" = "true" ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "format_failed=${FORMAT_FAILED}" >> "$GITHUB_OUTPUT"
            echo "build_failed=${BUILD_FAILED}" >> "$GITHUB_OUTPUT"
            echo "unformatted_count=${UNFORMATTED_COUNT}" >> "$GITHUB_OUTPUT"

            {
              if [ "$FORMAT_FAILED" = "true" ]; then
                echo "Formatting Issues (run 'forge fmt' to fix):"
                head -n 20 format-output.txt 2>/dev/null || echo "(no output)"
              fi
              if [ "$BUILD_FAILED" = "true" ]; then
                echo ""
                echo "Build Errors:"
                grep -iE "error" build-output.txt 2>/dev/null | head -20 || tail -n 20 build-output.txt
              fi
            } > lint-error-details.txt 2>/dev/null
          else
            echo "success=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: format-lint-outputs
          path: |
            format-output.txt
            build-output.txt
            lint-error-details.txt
          retention-days: 7

      - name: Update PR summary comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Format & Lint
          SUCCESS: ${{ steps.run.outputs.success }}
          FORMAT_FAILED: ${{ steps.run.outputs.format_failed }}
          BUILD_FAILED: ${{ steps.run.outputs.build_failed }}
          UNFORMATTED_COUNT: ${{ steps.run.outputs.unformatted_count }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const formatFailed = process.env.FORMAT_FAILED === 'true';
            const buildFailed = process.env.BUILD_FAILED === 'true';
            const unformattedCount = process.env.UNFORMATTED_COUNT || '0';
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            const status = success ? "✅" : "❌";
            let summary;
            if (success) {
              summary = "All checks passed";
            } else {
              const issues = [];
              if (formatFailed) issues.push(`${unformattedCount} files need formatting`);
              if (buildFailed) issues.push("build failed");
              summary = issues.join(", ");
            }
            
            let details = "";
            try {
              if (fs.existsSync('lint-error-details.txt')) {
                details = fs.readFileSync('lint-error-details.txt', 'utf8').trim().substring(0, 2000);
              }
            } catch (e) {}
            
            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| ${section} | ${status} | ${summary} |\n`;
            
            if (!success && details) {
              block += `\n<details>\n<summary>📋 ${section} Details</summary>\n\n`;
              block += `\`\`\`\n${details}\n\`\`\`\n\n`;
              block += `[View full logs](https://github.com/${repo}/actions/runs/${runId})\n`;
              block += `</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const tableHeader = "| Check | Status | Summary |\n|:------|:------:|:--------|\n";
            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}`;
            
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              const headerEnd = baseBody.indexOf('\n', baseBody.indexOf('|:---'));
              if (headerEnd !== -1) {
                nextBody = baseBody.slice(0, headerEnd + 1) + block + baseBody.slice(headerEnd + 1);
              } else {
                nextBody = baseBody + block;
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

      - name: Fail workflow if checks failed
        if: env.FORMAT_FAILED == 'true' || env.BUILD_FAILED == 'true'
        run: exit 1