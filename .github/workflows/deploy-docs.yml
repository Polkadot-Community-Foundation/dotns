name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "contracts/**"
      - "**.sol"
      - "foundry.toml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "contracts/**"
      - "**.sol"
      - "foundry.toml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write
  issues: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Generate documentation
        id: docs
        run: |
          set +e
          
          # Generate docs with forge doc (builds mdbook site)
          forge doc --build --out docs-output 2>&1 | tee forge-doc.log
          DOC_CODE=${PIPESTATUS[0]}
          
          if [ $DOC_CODE -eq 0 ] && [ -d "docs-output/book" ]; then
            # Count documented contracts
            CONTRACT_COUNT=$(find docs-output/book/src -name "*.md" 2>/dev/null | wc -l || echo "?")
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
            echo "summary=${CONTRACT_COUNT} contract docs generated" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "summary=Documentation build failed" >> "$GITHUB_OUTPUT"
            {
              echo "details<<EOF"
              echo "### Forge Doc Output"
              tail -n 50 forge-doc.log
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-output/book

      - name: Upload docs artifact (for PRs)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: docs-output/book
          retention-days: 7

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Documentation
          STATUS: ${{ steps.docs.outputs.status }}
          SUMMARY: ${{ steps.docs.outputs.summary }}
          DETAILS: ${{ steps.docs.outputs.details }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const tableHeader = "| Check | Status | Summary |\n|-------|--------|---------|";
            
            const section = process.env.SECTION;
            const status = process.env.STATUS || "❌ Failed";
            const summary = process.env.SUMMARY || "";
            const details = process.env.DETAILS || "";
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| **${section}** | ${status} | ${summary} |\n`;

            if (details.trim()) {
              block += `<details><summary>📋 Details</summary>\n\n\`\`\`\n${details.trim()}\n\`\`\`\n\n`;
              block += `[View full logs](https://github.com/${repo}/actions/runs/${runId})\n</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4