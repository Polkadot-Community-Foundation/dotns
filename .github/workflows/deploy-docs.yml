name: Documentation

on:
  push:
    branches: [main]
    paths: ['src/**', 'contracts/**', '**.sol', 'foundry.toml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'contracts/**', '**.sol', 'foundry.toml']
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - run: forge install
      - run: forge build

      - name: Generate docs
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          if ! forge doc --out docs-output; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "summary=forge doc failed" >> "$GITHUB_OUTPUT"
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "docs-output/book.toml" ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "summary=No book.toml generated" >> "$GITHUB_OUTPUT"
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd docs-output
          if ! mdbook build; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "summary=mdbook build failed" >> "$GITHUB_OUTPUT"
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd ..

          if [ -d "docs-output/book" ]; then
            # Add .nojekyll to prevent GitHub from processing with Jekyll
            touch docs-output/book/.nojekyll
            COUNT=$(find docs-output/book -name "*.html" | wc -l | tr -d ' ')
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
            echo "status=Passed" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "summary=No book directory created" >> "$GITHUB_OUTPUT"
            echo "status=Failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Set paths
        id: path
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PR_NUM="${{ github.event.pull_request.number }}"
            echo "target=preview/pr-${PR_NUM}" >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER}.github.io/${REPO_NAME}/preview/pr-${PR_NUM}/" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
            echo "url=https://${OWNER}.github.io/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug paths
        run: |
          echo "Target: ${{ steps.path.outputs.target }}"
          echo "URL: ${{ steps.path.outputs.url }}"
          echo "Success: ${{ steps.run.outputs.success }}"
          ls -la docs-output/book/ || echo "No book directory"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs
          path: docs-output/
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: steps.run.outputs.success == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-output/book
          destination_dir: ${{ steps.path.outputs.target }}
          keep_files: true
          force_orphan: false

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Documentation
          STATUS: ${{ steps.run.outputs.status }}
          COUNT: ${{ steps.run.outputs.count }}
          SUMMARY: ${{ steps.run.outputs.summary }}
          DOCS_URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const tableEnd = "<!-- table-end -->";
            const section = process.env.SECTION;
            const status = process.env.STATUS || 'Unknown';
            const count = process.env.COUNT || '0';
            const errorSummary = process.env.SUMMARY || '';
            const docsUrl = process.env.DOCS_URL || '';

            console.log('Status:', status);
            console.log('Count:', count);
            console.log('URL:', docsUrl);

            let summary;
            if (status === 'Passed') {
              summary = docsUrl ? `${count} pages - [View Docs](${docsUrl})` : `${count} pages`;
            } else {
              summary = errorSummary;
            }

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            if (existing?.body) {
              const tableSection = existing.body.split(tableEnd)[0] || existing.body;
              const rowRegex = /^\| ([^|]+) \| ([^|]+) \| ([^|]+) \|$/gm;
              let match;
              while ((match = rowRegex.exec(tableSection)) !== null) {
                const name = match[1].trim();
                if (name && name !== 'Check' && !name.startsWith(':')) {
                  rows[name] = { status: match[2].trim(), summary: match[3].trim() };
                }
              }
              const detailsMatch = existing.body.match(/<!-- table-end -->([\s\S]*$)/);
              if (detailsMatch) detailsSection = detailsMatch[1];
            }

            rows[section] = { status, summary };

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key].status} | ${rows[key].summary} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${tableEnd}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - if: steps.run.outputs.success != 'true'
        run: exit 1

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="preview/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up preview for PR #${{ github.event.pull_request.number }}" || true
          git push