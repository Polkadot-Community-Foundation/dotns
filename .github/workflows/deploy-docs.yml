name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "contracts/**"
      - "**.sol"
      - "foundry.toml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "contracts/**"
      - "**.sol"
      - "foundry.toml"
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install mdbook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - name: Install dependencies
        run: forge install

      - name: Generate documentation
        id: docs
        shell: bash
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          
          forge doc --out docs-output 2>&1 | tee forge-doc.log
          DOC_CODE=${PIPESTATUS[0]}
          
          if [ $DOC_CODE -ne 0 ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "doc_count=0" >> "$GITHUB_OUTPUT"
            tail -n 30 forge-doc.log > doc-error.txt 2>/dev/null
            exit 0
          fi
          
          cd docs-output
          mdbook build 2>&1 | tee ../mdbook-build.log
          BUILD_CODE=${PIPESTATUS[0]}
          cd ..
          
          if [ $BUILD_CODE -eq 0 ] && [ -d "docs-output/book" ]; then
            CONTRACT_COUNT=$(find docs-output/book -name "*.html" 2>/dev/null | wc -l | tr -d '[:space:]')
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "doc_count=${CONTRACT_COUNT:-0}" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "doc_count=0" >> "$GITHUB_OUTPUT"
            {
              cat forge-doc.log
              echo ""
              cat mdbook-build.log 2>/dev/null
            } > doc-error.txt 2>/dev/null
          fi

      - name: Determine deploy path
        id: path
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "target=preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
          fi

      - name: Upload docs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: |
            docs-output/
            forge-doc.log
            mdbook-build.log
            doc-error.txt
          retention-days: 7

      - name: Deploy to GitHub Pages
        if: steps.docs.outputs.success == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-output/book
          destination_dir: ${{ steps.path.outputs.target }}
          keep_files: true

      - name: Set preview URL
        id: preview
        if: github.event_name == 'pull_request' && steps.docs.outputs.success == 'true'
        run: |
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          echo "url=https://${OWNER}.github.io/${REPO}/preview/pr-${PR_NUM}/" >> "$GITHUB_OUTPUT"

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Documentation
          SUCCESS: ${{ steps.docs.outputs.success }}
          DOC_COUNT: ${{ steps.docs.outputs.doc_count }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const docCount = process.env.DOC_COUNT || '0';
            const previewUrl = process.env.PREVIEW_URL || '';
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            const status = success ? "✅" : "❌";
            let summary = success ? `${docCount} pages` : "Build failed";
            if (success && previewUrl) {
              summary += ` [📖 Preview](${previewUrl})`;
            }
            
            let details = "";
            try {
              if (fs.existsSync('doc-error.txt')) {
                details = fs.readFileSync('doc-error.txt', 'utf8').trim().substring(0, 2000);
              }
            } catch (e) {}
            
            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| ${section} | ${status} | ${summary} |\n`;
            
            if (!success && details) {
              block += `\n<details>\n<summary>📋 ${section} Details</summary>\n\n`;
              block += `\`\`\`\n${details}\n\`\`\`\n\n`;
              block += `[View logs](https://github.com/${repo}/actions/runs/${runId})\n`;
              block += `</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const tableHeader = "| Check | Status | Summary |\n|:------|:------:|:--------|\n";
            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}`;
            
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              const headerEnd = baseBody.indexOf('\n', baseBody.indexOf('|:---'));
              if (headerEnd !== -1) {
                nextBody = baseBody.slice(0, headerEnd + 1) + block + baseBody.slice(headerEnd + 1);
              } else {
                nextBody = baseBody + block;
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

      - name: Fail if docs failed
        if: steps.docs.outputs.success != 'true'
        run: exit 1

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove preview directory
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          PREVIEW_DIR="preview/pr-${PR_NUM}"
          
          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Clean up docs preview for PR #${PR_NUM}" || true
            git push
          fi