name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "contracts/**"
      - "**.sol"
      - "foundry.toml"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "contracts/**"
      - "**.sol"
      - "foundry.toml"
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Don't run on PR close unless it's for cleanup
    if: github.event.action != 'closed'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install dependencies
        run: forge install

      - name: Generate documentation
        id: docs
        shell: bash
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          set +e
          
          forge doc --build --out docs-output 2>&1 | tee forge-doc.log
          DOC_CODE=${PIPESTATUS[0]}
          
          if [ $DOC_CODE -eq 0 ] && [ -d "docs-output/book" ]; then
            # Count docs, trim whitespace, default to 0
            CONTRACT_COUNT=$(find docs-output/book/src -name "*.md" 2>/dev/null | wc -l | tr -d ' ' || echo "0")
            CONTRACT_COUNT=${CONTRACT_COUNT:-0}
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
            echo "summary=${CONTRACT_COUNT} docs generated" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
            echo "success=true" >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
            echo "summary=Build failed" >> "$GITHUB_OUTPUT"
            echo "success=false" >> "$GITHUB_OUTPUT"
            {
              echo "details<<DOC_OUTPUT_END_12345"
              tail -n 40 forge-doc.log
              echo "DOC_OUTPUT_END_12345"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Determine deploy path
        id: path
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "target=preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "is_preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
            echo "is_preview=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to GitHub Pages
        if: steps.docs.outputs.success == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-output/book
          destination_dir: ${{ steps.path.outputs.target }}
          keep_files: true

      - name: Set preview URL
        id: preview
        if: github.event_name == 'pull_request' && steps.docs.outputs.success == 'true'
        run: |
          # Get repo owner and name
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          
          # Construct GitHub Pages URL
          PREVIEW_URL="https://${OWNER}.github.io/${REPO}/preview/pr-${PR_NUM}/"
          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"

      - name: Update PR summary comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Documentation
          STATUS: ${{ steps.docs.outputs.status }}
          SUMMARY: ${{ steps.docs.outputs.summary }}
          DETAILS: ${{ steps.docs.outputs.details }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const tableHeader = "| Check | Status | Summary |\n|-------|--------|---------|";
            
            const section = process.env.SECTION;
            const status = process.env.STATUS || "❌ Failed";
            const previewUrl = process.env.PREVIEW_URL || "";
            const details = process.env.DETAILS || "";
            const runId = process.env.RUN_ID;
            const repo = process.env.REPO;
            
            // Add preview link to summary if available
            let summary = process.env.SUMMARY || "";
            if (previewUrl) {
              summary += ` [📖 Preview](${previewUrl})`;
            }

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| **${section}** | ${status} | ${summary} |\n`;

            if (details.trim()) {
              block += `<details><summary>📋 Details</summary>\n\n\`\`\`\n${details.trim()}\n\`\`\`\n\n`;
              block += `[View logs](https://github.com/${repo}/actions/runs/${runId})\n</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo: repoName } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo: repoName,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo: repoName,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo: repoName,
                issue_number,
                body: nextBody,
              });
            }

      - name: Fail if docs failed
        if: steps.docs.outputs.success != 'true'
        run: exit 1

  # Cleanup preview when PR is closed
  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove preview directory
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          PREVIEW_DIR="preview/pr-${PR_NUM}"
          
          if [ -d "$PREVIEW_DIR" ]; then
            rm -rf "$PREVIEW_DIR"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Clean up docs preview for PR #${PR_NUM}" || echo "Nothing to clean up"
            git push
          else
            echo "Preview directory doesn't exist, nothing to clean up"
          fi