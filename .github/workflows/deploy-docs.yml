name: Documentation

on:
  push:
    branches: [main]
    paths: ['src/**', 'contracts/**', '**.sol', 'foundry.toml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'contracts/**', '**.sol', 'foundry.toml']
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.4.40/mdbook-v0.4.40-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv mdbook /usr/local/bin/

      - run: forge install
      - run: forge build

      - name: Generate docs
        id: run
        env:
          FOUNDRY_DISABLE_NIGHTLY_WARNING: "1"
        run: |
          if ! forge doc --out docs-output; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "error=forge doc failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -f "docs-output/book.toml" ]; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "error=No book.toml generated" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cd docs-output
          if ! mdbook build; then
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "error=mdbook build failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd ..

          if [ -d "docs-output/book" ]; then
            COUNT=$(find docs-output/book -name "*.html" | wc -l | tr -d ' ')
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "count=${COUNT}" >> "$GITHUB_OUTPUT"
          else
            echo "success=false" >> "$GITHUB_OUTPUT"
            echo "error=No book directory created" >> "$GITHUB_OUTPUT"
          fi

      - name: Set paths
        id: path
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "target=preview/pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/preview/pr-${{ github.event.pull_request.number }}/" >> "$GITHUB_OUTPUT"
          else
            echo "target=." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs
          path: docs-output/
          retention-days: 7

      - name: Check gh-pages branch
        if: steps.run.outputs.success == 'true'
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan gh-pages
            git reset --hard
            echo "# Documentation" > index.html
            git add index.html
            git commit -m "Initialize gh-pages"
            git push origin gh-pages
            git checkout -
          fi

      - uses: peaceiris/actions-gh-pages@v4
        if: steps.run.outputs.success == 'true'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs-output/book
          destination_dir: ${{ steps.path.outputs.target }}
          keep_files: true
          enable_jekyll: false

      - name: Update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SECTION: Documentation
          SUCCESS: ${{ steps.run.outputs.success }}
          COUNT: ${{ steps.run.outputs.count }}
          ERROR: ${{ steps.run.outputs.error }}
          URL: ${{ steps.path.outputs.url }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const count = process.env.COUNT || '0';
            const error = process.env.ERROR || '';
            const url = process.env.URL || '';

            const status = success ? "✅" : "❌";
            let summary = success ? `${count} pages` : `Build failed: ${error}`;
            if (success && url) summary += ` [📖 Preview](${url})`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            if (existing?.body) {
              const rowRegex = /^\| ([^|]+) \| ([^|]+) \| ([^|]+) \|$/gm;
              let match;
              while ((match = rowRegex.exec(existing.body)) !== null) {
                const name = match[1].trim();
                if (name && name !== 'Check' && !name.startsWith(':')) {
                  rows[name] = { status: match[2].trim(), summary: match[3].trim() };
                }
              }
              const detailsMatch = existing.body.match(/\n---\n[\s\S]*$/);
              if (detailsMatch) detailsSection = detailsMatch[0];
            }

            rows[section] = { status, summary };

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key].status} | ${rows[key].summary} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - if: steps.run.outputs.success != 'true'
        run: exit 1

  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
      - run: |
          DIR="preview/pr-${{ github.event.pull_request.number }}"
          [ -d "$DIR" ] || exit 0
          rm -rf "$DIR"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up preview for PR #${{ github.event.pull_request.number }}" || true
          git push