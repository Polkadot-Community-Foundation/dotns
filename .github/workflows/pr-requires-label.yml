name: PR Requires Label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate labels
        id: run
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        shell: bash
        run: |
          required=("frontend" "smartcontracts" "other")
          labels="$(echo "$LABELS_JSON" | jq -r '.[].name' 2>/dev/null || true)"
          found=0
          for l in $labels; do
            for r in "${required[@]}"; do
              [ "$l" = "$r" ] && found=1 && break 2
            done
          done
          if [ $found -eq 1 ]; then
            echo "status=Passed" >> "$GITHUB_OUTPUT"
            echo "summary=Valid" >> "$GITHUB_OUTPUT"
          else
            echo "status=Failed" >> "$GITHUB_OUTPUT"
            echo "summary=Missing required label" >> "$GITHUB_OUTPUT"
          fi
          exit $( [ $found -eq 1 ] && echo 0 || echo 1 )

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Labels
          STATUS: ${{ steps.run.outputs.status }}
          SUMMARY: ${{ steps.run.outputs.summary }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const tableEnd = "<!-- table-end -->";
            const section = process.env.SECTION;
            const status = process.env.STATUS || 'Unknown';
            const summary = process.env.SUMMARY || '';

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            let rows = {};
            let detailsSection = '';
            if (existing?.body) {
              const tableSection = existing.body.split(tableEnd)[0] || existing.body;
              const rowRegex = /^\| ([^|]+) \| ([^|]+) \| ([^|]+) \|$/gm;
              let match;
              while ((match = rowRegex.exec(tableSection)) !== null) {
                const name = match[1].trim();
                if (name && name !== 'Check' && !name.startsWith(':')) {
                  rows[name] = { status: match[2].trim(), summary: match[3].trim() };
                }
              }
              const detailsMatch = existing.body.match(/<!-- table-end -->([\s\S]*$)/);
              if (detailsMatch) detailsSection = detailsMatch[1];
            }

            rows[section] = { status, summary };

            const order = ['4naly3er Analysis', 'Slither Analysis', 'Contract Tests', 'Documentation', 'Format & Lint', 'Deploy Contracts', 'PR Title', 'Labels'];
            const sortedKeys = Object.keys(rows).sort((a, b) => {
              const ai = order.indexOf(a), bi = order.indexOf(b);
              return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
            });

            let table = `| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            for (const key of sortedKeys) {
              table += `| ${key} | ${rows[key].status} | ${rows[key].summary} |\n`;
            }

            const body = `${marker}\n## CI Summary\n\n${table}${tableEnd}${detailsSection}`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }