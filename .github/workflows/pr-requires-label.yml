name: pr-requires-label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Validate labels
        id: run
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        shell: bash
        run: |
          set +e

          required=("frontend" "smartcontracts" "other")
          found=0

          labels="$(echo "$LABELS_JSON" | jq -r '.[].name' 2>/dev/null || true)"

          for l in $labels; do
            for r in "${required[@]}"; do
              if [ "$l" = "$r" ]; then
                found=1
                break 2
              fi
            done
          done

          if [ "$found" -eq 1 ]; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "labels=${labels//$'\n'/, }" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "success=false" >> "$GITHUB_OUTPUT"
          echo "labels=${labels:-none}" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Update PR summary comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Labels
          SUCCESS: ${{ steps.run.outputs.success }}
          LABELS: ${{ steps.run.outputs.labels }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const labels = process.env.LABELS || 'none';
            
            const status = success ? "✅" : "❌";
            const summary = success ? "Valid" : "Missing required label";
            
            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            let block = `${sectionStart}\n`;
            block += `| ${section} | ${status} | ${summary} |\n`;
            
            if (!success) {
              block += `\n<details>\n<summary>❌ ${section} Details</summary>\n\n`;
              block += `**Required:** One of \`frontend\`, \`smartcontracts\`, \`other\`\n\n`;
              block += `**Current:** \`${labels}\`\n`;
              block += `</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const tableHeader = "| Check | Status | Summary |\n|:------|:------:|:--------|\n";
            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}`;
            
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              const headerEnd = baseBody.indexOf('\n', baseBody.indexOf('|:---'));
              if (headerEnd !== -1) {
                nextBody = baseBody.slice(0, headerEnd + 1) + block + baseBody.slice(headerEnd + 1);
              } else {
                nextBody = baseBody + block;
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }