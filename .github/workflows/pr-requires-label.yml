name: pr-requires-label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Validate labels (capture result)
        id: run
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        shell: bash
        run: |
          set +e

          required=("frontend" "smartcontracts" "other")
          found=0

          labels="$(echo "$LABELS_JSON" | jq -r '.[].name' 2>/dev/null || true)"

          for l in $labels; do
            for r in "${required[@]}"; do
              if [ "$l" = "$r" ]; then
                found=1
                break 2
              fi
            done
          done

          if [ "$found" -eq 1 ]; then
            echo "status=✅ Passed" >> "$GITHUB_OUTPUT"
            echo "details=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "status=❌ Failed" >> "$GITHUB_OUTPUT"
          echo "details<<EOF" >> "$GITHUB_OUTPUT"
          echo "PR must have at least one label: frontend | smartcontracts | other" >> "$GITHUB_OUTPUT"
          echo "Current: ${labels:-"(none)"}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          exit 1

      - name: Update PR summary comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Labels
          STATUS: ${{ steps.run.outputs.status }}
          DETAILS: ${{ steps.run.outputs.details }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION ?? "Labels";
            const status = process.env.STATUS ?? "❌ Failed";
            const details = process.env.DETAILS ?? "";

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            const block =
              `${sectionStart}\n` +
              `#### ${section}\n` +
              `Status: ${status}\n` +
              (details ? `\n\`\`\`\n${details}\n\`\`\`\n` : "\n") +
              `${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n### CI summary\n\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }
