name: PR Requires Label

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize, ready_for_review]

permissions:
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate labels
        id: run
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels) }}
        shell: bash
        run: |
          required=("frontend" "smartcontracts" "other")
          labels="$(echo "$LABELS_JSON" | jq -r '.[].name' 2>/dev/null || true)"
          found=0
          for l in $labels; do
            for r in "${required[@]}"; do
              [ "$l" = "$r" ] && found=1 && break 2
            done
          done
          echo "success=$( [ $found -eq 1 ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
          exit $( [ $found -eq 1 ] && echo 0 || echo 1 )

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: Labels
          SUCCESS: ${{ steps.run.outputs.success }}
        with:
          script: |
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const status = success ? "✅" : "❌";
            const summary = success ? "Valid" : "Missing required label";
            
            const sectionStart = `<!-- ${section}:start -->`;
            const sectionEnd = `<!-- ${section}:end -->`;
            const row = `| ${section} | ${status} | ${summary} |\n`;
            const block = `${sectionStart}\n${row}${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            const header = `${marker}\n## CI Summary\n\n| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            let body = existing?.body ?? header;
            
            if (body.includes(sectionStart)) {
              const re = new RegExp(`${sectionStart}\\n[\\s\\S]*?${sectionEnd}\\n`, "m");
              body = body.replace(re, block);
            } else {
              const insertPoint = body.indexOf('\n|:---');
              const insertAfter = body.indexOf('\n', insertPoint + 1);
              body = body.slice(0, insertAfter + 1) + block + body.slice(insertAfter + 1);
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }