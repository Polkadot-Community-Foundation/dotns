name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr_title:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title
        id: run
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const re = /^\[(Bug|Feat|Chore|Docs)\](\[(Smart contract)\])?:\s.+/;
            const ok = re.test(title);

            core.setOutput("success", ok ? "true" : "false");
            core.setOutput("title", title);

            if (!ok) core.setFailed("Invalid PR title.");

      - name: Update PR summary comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: PR Title
          SUCCESS: ${{ steps.run.outputs.success }}
          TITLE: ${{ steps.run.outputs.title }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const title = process.env.TITLE || '';
            
            const status = success ? "✅" : "❌";
            const summary = success ? "Valid format" : "Invalid format";
            
            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            // Build table row
            let block = `${sectionStart}\n`;
            block += `| ${section} | ${status} | ${summary} |\n`;
            
            // Add details if failed
            if (!success) {
              block += `\n<details>\n<summary>❌ ${section} Details</summary>\n\n`;
              block += `**Expected format:** \`[Bug|Feat|Chore|Docs]: description\`\n\n`;
              block += `**Got:** \`${title}\`\n`;
              block += `</details>\n`;
            }
            
            block += `${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const tableHeader = "| Check | Status | Summary |\n|:------|:------:|:--------|\n";
            const baseBody = existing?.body ?? `${marker}\n## 🔍 CI Summary\n\n${tableHeader}`;
            
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              // Insert after table header or at end
              const headerEnd = baseBody.indexOf('\n', baseBody.indexOf('|:---'));
              if (headerEnd !== -1) {
                nextBody = baseBody.slice(0, headerEnd + 1) + block + baseBody.slice(headerEnd + 1);
              } else {
                nextBody = baseBody + block;
              }
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }