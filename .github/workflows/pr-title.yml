name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        id: run
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const re = /^\[(Bug|Feat|Chore|Docs)\](\[(Smart contract)\])?:\s.+/;
            const ok = re.test(title);
            core.setOutput("success", ok ? "true" : "false");
            if (!ok) core.setFailed("Invalid PR title.");

      - name: Update PR comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: PR Title
          SUCCESS: ${{ steps.run.outputs.success }}
        with:
          script: |
            const fs = require('fs');
            const marker = "<!-- ci-summary -->";
            const section = process.env.SECTION;
            const success = process.env.SUCCESS === 'true';
            const status = success ? "✅" : "❌";
            const summary = success ? "Valid format" : "Invalid format";
            
            const sectionStart = `<!-- ${section}:start -->`;
            const sectionEnd = `<!-- ${section}:end -->`;
            const row = `| ${section} | ${status} | ${summary} |\n`;
            const block = `${sectionStart}\n${row}${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" && c.body?.includes(marker)
            );

            const header = `${marker}\n## CI Summary\n\n| Check | Status | Summary |\n|:------|:------:|:--------|\n`;
            let body = existing?.body ?? header;
            
            if (body.includes(sectionStart)) {
              const re = new RegExp(`${sectionStart}\\n[\\s\\S]*?${sectionEnd}\\n`, "m");
              body = body.replace(re, block);
            } else {
              const insertPoint = body.indexOf('\n|:---');
              const insertAfter = body.indexOf('\n', insertPoint + 1);
              body = body.slice(0, insertAfter + 1) + block + body.slice(insertAfter + 1);
            }

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }