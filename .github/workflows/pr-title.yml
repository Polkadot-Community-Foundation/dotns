name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  pr_title:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR title (set outputs)
        id: run
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title || "";
            const re = /^\[(Bug|Feat|Chore|Docs)\](\[(Frontend|Smart contract)\])?:\s.+/;

            const ok = re.test(title);

            core.setOutput("status", ok ? "✅ Passed" : "❌ Failed");
            core.setOutput(
              "details",
              ok
                ? ""
                : `Invalid PR title.\nExpected: "[Bug][Frontend]: ...", "[Feat]: ...", "[Chore]: ...", "[Docs]: ..."\nGot: "${title}"`
            );

            if (!ok) core.setFailed("Invalid PR title.");

      - name: Update PR summary comment
        if: always()
        uses: actions/github-script@v7
        env:
          SECTION: PR Title
          STATUS: ${{ steps.run.outputs.status }}
          DETAILS: ${{ steps.run.outputs.details }}
        with:
          script: |
            const marker = "<!-- dotns-ci-summary -->";
            const section = process.env.SECTION ?? "PR Title";
            const status = process.env.STATUS ?? "❌ Failed";
            const details = process.env.DETAILS ?? "";

            const sectionStart = `<!-- section:${section}:start -->`;
            const sectionEnd = `<!-- section:${section}:end -->`;

            const block =
              `${sectionStart}\n` +
              `#### ${section}\n` +
              `Status: ${status}\n` +
              (details ? `\n\`\`\`\n${details}\n\`\`\`\n` : "\n") +
              `${sectionEnd}\n`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find(c =>
              c.user?.login === "github-actions[bot]" &&
              typeof c.body === "string" &&
              c.body.includes(marker)
            );

            const baseBody = existing?.body ?? `${marker}\n### CI summary\n\n`;
            const hasSection = baseBody.includes(sectionStart) && baseBody.includes(sectionEnd);

            let nextBody;
            if (hasSection) {
              const re = new RegExp(`${sectionStart}[\\s\\S]*?${sectionEnd}\\n?`, "m");
              nextBody = baseBody.replace(re, block);
            } else {
              nextBody = `${baseBody.trimEnd()}\n\n${block}`;
            }

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: nextBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: nextBody,
              });
            }
