name: Tag Code Owners on Whitelist Requests

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  notify-codeowners:
    if: contains(github.event.issue.labels.*.name, 'whitelist-request')
    runs-on: ubuntu-latest
    steps:
      - name: Load CODEOWNERS reviewers
        id: codeowners
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.repos.getContent({
              owner,
              repo,
              path: ".github/CODEOWNERS",
              ref: context.payload.repository.default_branch,
            });
            const content = Buffer.from(data.content, data.encoding || "base64").toString("utf8");
            const mentions = [...new Set(content.match(/@[A-Za-z0-9-]+(?:\/[A-Za-z0-9_.-]+)?/g) || [])];
            core.setOutput("mentions", mentions.join(" "));

      - name: Tag code owners for review
        uses: actions/github-script@v7
        env:
          REVIEWERS: ${{ steps.codeowners.outputs.mentions }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const opener = context.payload.issue.user.login;

            const body = [
              "### Code Owner Review Required",
              "",
              process.env.REVIEWERS,
              "",
              `New whitelist request from @${opener}. Review the address and apply \`whitelist-approved\` to proceed.`,
            ].join("\n");

            await github.rest.issues.createComment({ owner, repo, issue_number, body });
