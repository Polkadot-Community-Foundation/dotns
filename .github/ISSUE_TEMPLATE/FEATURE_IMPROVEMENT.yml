name: Feature / Improvement
description: Propose a new feature or improvement
title: "[Feat]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Select the area this issue relates to
      options:
        - Frontend
        - Smart contracts
        - Other
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What problem does this solve? What is the desired outcome?
      placeholder: One or two concise paragraphs.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the proposed change at a high level. Link designs/specs if available.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of conditions to consider this done
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Context / notes
      description: Links to related issues, PRs, discussions, or benchmarks
    validations:
      required: false